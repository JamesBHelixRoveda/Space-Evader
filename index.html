<style>
  :root{
    --bg1:#141B4D;      /* tiefes Nachtblau */
    --bg2:#2A1A5E;      /* Violett */
    --bg3:#0B1030;      /* fast schwarz unten */
    --ink:#F4F7FF;      /* helle Schrift */
    --accent:#FFD23F;   /* warmes Sonnengelb */
    --accent2:#4FE3C1;  /* Mint */
    --panel:rgba(18,22,55,.82);
    --danger:#FF6B8B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg3);}
  body{
    font-family:"Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  #game{position:absolute;inset:0;touch-action:none;overflow:hidden;}
  canvas{position:absolute;inset:0;display:block;touch-action:none;}

  /* ---- HUD ---- */
  #hud{
    position:absolute;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0) + 12px) 16px 12px;
    display:flex;align-items:flex-start;justify-content:space-between;
    pointer-events:none;font-weight:700;
  }
  .pill{
    background:var(--panel);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:8px 14px;
    line-height:1;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  .pill .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.62;font-weight:800;display:block;margin-bottom:5px;}
  .pill .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  #timerPill .val{color:var(--accent);}
  #timerPill.warn .val{color:var(--danger);}
  #scorePill{text-align:center;}
  #timerPill{text-align:right;}
  .leftGroup{display:flex;align-items:center;gap:9px;}
  .lives{display:flex;align-items:center;gap:5px;}
  .lives .mini{width:26px;height:19px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.42));}

  /* ---- Overlays ---- */
  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:radial-gradient(120% 120% at 50% 30%, rgba(10,14,44,.35), rgba(6,9,28,.86));
    backdrop-filter:blur(3px);
  }
  #overlay.show{display:flex;}
  .card{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.14);
    border-radius:26px;
    padding:30px 26px 26px;
    max-width:340px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:pop .32s cubic-bezier(.2,1.2,.35,1);
  }
  @keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
  .emojiBig{font-size:64px;line-height:1;margin-bottom:6px;}
  h1{font-size:30px;margin:6px 0 2px;font-weight:800;letter-spacing:-.01em;}
  h2{font-size:24px;margin:6px 0 2px;font-weight:800;}
  .sub{opacity:.72;font-size:15px;margin:8px 0 20px;font-weight:600;line-height:1.45;}
  .statRow{display:flex;gap:12px;justify-content:center;margin:0 0 20px;}
  .stat{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 8px;}
  .stat .n{font-size:26px;font-weight:800;}
  .stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;font-weight:800;margin-top:4px;}
  button.play{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;padding:16px;border-radius:18px;
    font-family:inherit;font-size:19px;font-weight:800;color:#1a1330;
    background:linear-gradient(180deg,var(--accent),#F5B800);
    box-shadow:0 8px 0 #C98F00, 0 14px 24px rgba(0,0,0,.35);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  button.play:active{transform:translateY(5px);box-shadow:0 3px 0 #C98F00,0 8px 16px rgba(0,0,0,.35);}
  .hint{margin-top:16px;font-size:13px;opacity:.6;font-weight:600;}

  /* ---- Retro-Bestenliste ---- */
  .card.board{
    max-width:360px;
    padding:0;
    background:#0C1136;
    border:2px solid rgba(255,210,63,.45);
    overflow:hidden;
    position:relative;
  }
  .wimmel{
    position:absolute;inset:0;pointer-events:none;overflow:hidden;
    font-size:19px;line-height:1.05;letter-spacing:1px;
    opacity:.42;
    filter:saturate(1.1);
  }
  .wimmel span{position:absolute;transform-origin:center;}
  .boardInner{
    position:relative;
    margin:52px 46px;
    background:rgba(6,9,32,.94);
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:16px 12px 14px;
  }
  .boardTitle{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:16px;font-weight:800;letter-spacing:.20em;
    color:var(--accent);text-align:center;margin-bottom:12px;
    text-shadow:0 0 10px rgba(255,210,63,.55);
  }
  table.hs{
    width:100%;border-collapse:collapse;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:15px;font-weight:700;
  }
  table.hs td{padding:4px 2px;white-space:nowrap;}
  table.hs td.rk{width:2.2em;opacity:.65;}
  table.hs td.nm{letter-spacing:.16em;}
  table.hs td.lv{text-align:right;opacity:.55;font-size:12px;padding-right:8px;}
  table.hs td.sc{text-align:right;width:4.5em;color:var(--accent2);font-variant-numeric:tabular-nums;}
  table.hs tr.row{opacity:0;animation:fadeUp .16s ease forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  table.hs tr.first td{color:var(--accent);}
  table.hs tr.lit{animation:blink1 .62s steps(1,end) infinite;}
  @keyframes blink1{0%,60%{opacity:1}61%,100%{opacity:.28}}
  table.hs tr.me td{color:var(--accent2);text-shadow:0 0 9px rgba(79,227,193,.9);}
  table.hs tr.me.first td{color:var(--accent);text-shadow:0 0 10px rgba(255,210,63,.9);}

(() => {

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// kleines Untertassen-Symbol für die Lebensanzeige
const MINI = `<svg class="mini" viewBox="0 0 26 19" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <ellipse cx="13" cy="12.6" rx="11" ry="4.4" fill="#AEBCE6"/>

  <circle cx="21.4" cy="12.5" r="1.1" fill="#FF6B8B"/>
</svg>`;

let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2.5);

/* ---------- Level-Konfiguration ----------
   Pro Level genau EINE Sorte Meteoriten (ein Emoji).
   Nach dem letzten Thema wird die Liste wiederholt,
   der Schwierigkeitsgrad steigt aber weiter an.        */
/* 5 Themenblöcke à 10 Level:
   Level 1–9  = je EIN Objekt aus dem Block,
   Level 10   = alle 9 Objekte des Blocks bunt durcheinander.
   Danach der nächste Block. Insgesamt 50 Themen-Level, danach endlos (zyklisch). */
const THEMES = [
  { name:'Aliens', set:['👽','👾','🤖','👻','🎃','👹','👺','🐙','🦑'] },
  { name:'Tiere',  set:['🐰','🐱','🐶','🐨','🐼','🦊','🐧','🐸','🐥'] },
  { name:'Bälle',  set:['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🥎'] },
  { name:'Blüten', set:['🌸','🌺','🌻','🌷','🌹','🌼','🪷','🏵️','🥀'] },
  { name:'Obst',   set:['🍎','🍓','🍊','🥭','🍇','🍉','🍑','🍒','🥝'] },
];
const LEVEL_TIME = 15;      // Sekunden pro Level

function themeFor(lv){ return THEMES[Math.floor((lv-1)/10) % THEMES.length]; }
function isMixed(lv){ return ((lv-1) % 10) === 9; }           // jedes 10. Level
function emojiFor(lv){
  const t = themeFor(lv);
  return isMixed(lv) ? t.set[(Math.random()*t.set.length)|0] : t.set[(lv-1)%10];
}

/* ---------- Spielzustand ---------- */
const S = { START:'start', PLAY:'play', DYING:'dying', LEVELUP:'levelup', OVER:'over', NAME:'name', BOARD:'board', GUIDE:'guide' };
let state = S.START;

let level = 1;
let score = 0;
let highscore = 0;
let lives = 3;
let lifeMilestone = 0;      // bereits vergebene 500-Punkte-Leben
let invuln = 0;
let timeLeft = LEVEL_TIME;

const ship = { x:0, y:0, w:0, prevX:0, tilt:0, alive:true };
let meteors = [];
let particles = [];
let stars = [];
let planetT = 0;
let enemies = [];
let enemySchedule = [];
let enemyIdx = 0;
let cannons = [];
let cannonSchedule = [];
let cannonIdx = 0;
let bullets = [];
let powerups = [];
let schildPlan = [];
let schildIdx = 0;
let powerupDone = false;
let novaSchedule = 0;
let novaDone = false;
let flash = 0;
let shield = 0;

let spawnTimer = 0;
let lastSpawnX = -999;
let deathTimer = 0;
let lastTime = 0;

/* ---------- Sizing ---------- */
function resize(){
  const r = game.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ship.w = W * 0.10;                        // ca. 1/10 der Bildschirmbreite
  ship.yMax = H - ship.w * 0.60 - 16;       // Ruhelage ganz unten
  ship.yMin = ship.yMax - H/7;              // maximal ~1/7 nach oben
  ship.x = Math.min(Math.max(ship.x || W/2, ship.w/2), W - ship.w/2);
  ship.y = Math.min(Math.max(ship.y || ship.yMax, ship.yMin), ship.yMax);
  ship.prevX = ship.x;

  buildStars();
}
function safeBottom(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--sab');
  return 20;
}
window.addEventListener('resize', resize);

/* ---------- Sterne (Hintergrund) ---------- */
function buildStars(){
  stars = [];
  const n = Math.round((W*H)/9000);
  for(let i=0;i<n;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.6+0.4,
      tw:Math.random()*Math.PI*2,
      sp:Math.random()*1.4+0.3,
      drift:Math.random()*10+6
    });
  }
}

/* ---------- Schwierigkeit pro Level ---------- */
function difficulty(){
  const p = Math.min((level-1)/49, 1);           // Fortschritt 0..1 über 50 Level, dann Max
  let spawnInterval = 0.58 - p*0.32;              // 0.58s -> 0.26s  (mehr Objekte)
  // Jedes 10. Level (gemischte Objekte): 1,5-fache Objektdichte
  if(isMixed(level)) spawnInterval /= 1.5;
  const fallSpeed     = H*(0.34 + p*0.38);        // von Anfang an flotter
  const aimChance     = 0.28 + p*0.30;            // Anteil gezielt aufs Schiff -> nicht sitzenbleiben
  return { spawnInterval, fallSpeed, aimChance };
}

/* ---------- Himmelskörper: von außen nach innen, jedes Level ein neuer ---------- */
const PLANETEN = [
  { name:'Neptun',  art:'baender', a:'#0E2A72', b:'#1E56C4', c:'#7FB2FF', glow:'80,140,255',  fleck:'#0A1E52', atmo:'#4C8CFF' },
  { name:'Uranus',  art:'ringe_v', a:'#2E8C8C', b:'#68CFC9', c:'#C6F0EC', glow:'110,220,215', atmo:'#8FE8E2' },
  { name:'Saturn',  art:'ringe',   a:'#8A6A32', b:'#D8BC7E', c:'#F5E9C6', glow:'230,200,140', atmo:'#E8D2A0' },
  { name:'Jupiter', art:'baender', a:'#6E4626', b:'#C4915F', c:'#F0DEC4', glow:'220,170,120', fleck:'#C4462E', atmo:'#DEB98E' },
  { name:'Mars',    art:'kappen',  a:'#6B2A12', b:'#B4522A', c:'#E09468', glow:'230,110,70',  atmo:'#E08A5A' },
  { name:'Mond',    art:'krater',  a:'#54545E', b:'#A2A2AC', c:'#EFEFF5', glow:'200,200,215', kraterZahl:340, maria:true, detail:true },
  { name:'Erde',    art:'erde',    a:'#0A2A5E', b:'#2B6FC4', c:'#4FA3E0', glow:'90,170,240',  atmo:'#5FA8FF', detail:true },
  { name:'Venus',   art:'schleier',a:'#9A7A2E', b:'#DCC172', c:'#F7EBC2', glow:'240,215,140', atmo:'#F0DA9A' },
  { name:'Merkur',  art:'krater',  a:'#33333A', b:'#6E6E78', c:'#A4A4AE', glow:'150,150,165', kraterZahl:70 },
  { name:'Sonne',   art:'sonne',   a:'#B03505', b:'#FF9A1F', c:'#FFF4CC', glow:'255,170,50' },
];
function planetFor(lv){ return PLANETEN[(lv-1) % PLANETEN.length]; }   // jedes Level ein anderer

// schneller Ganzzahl-Hash (deutlich billiger als Math.sin) - liefert 0..1
function hash(i, s){
  let h = (i|0)*374761393 + (s|0)*668265263;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967295;
}

/* Wertrauschen + fbm: Grundlage für Wolken, Bänder, Albedomuster */
function noise2(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash(xi + yi*57, s),     b = hash(xi+1 + yi*57, s);
  const c = hash(xi + (yi+1)*57, s), d = hash(xi+1 + (yi+1)*57, s);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x, y, s, okt = 4){
  let f = 0, amp = 0.5, fr = 1;
  for(let i=0;i<okt;i++){ f += amp*noise2(x*fr, y*fr, s+i*13); amp *= 0.5; fr *= 2; }
  return f;
}
/* Weltkarte der Erde: je Zeile 5° Breite, Spalten 5° Länge (Spalte 0 = 180°W).
   Angegeben sind die Spaltenbereiche mit Land. */
const ERDE_ZEILEN = [
  [],                                                              // 90-85 N
  [[16,24],[28,32]],                                               // 85-80  Arktis-Inseln, Grönland
  [[12,25],[26,33],[39,40],[52,68]],                               // 80-75
  [[3,8],[10,26],[26,34],[40,42],[44,70]],                         // 75-70
  [[2,9],[9,25],[27,33],[38,43],[44,71]],                          // 70-65
  [[2,8],[8,24],[30,33],[34,35],[37,43],[44,71]],                  // 65-60
  [[2,7],[7,24],[35,36],[37,42],[43,71]],                          // 60-55
  [[5,24],[34,36],[37,44],[45,71]],                                // 55-50
  [[8,23],[36,44],[45,70],[64,66]],                                // 50-45
  [[10,23],[34,40],[42,70]],                                       // 45-40  Iberien, Italien, Asien, Japan
  [[11,23],[34,45],[46,68]],                                       // 40-35
  [[12,22],[34,45],[46,64]],                                       // 35-30
  [[14,21],[34,46],[50,54],[55,63]],                               // 30-25  Sahara, Indien, China
  [[15,20],[34,47],[50,54],[55,62]],                               // 25-20
  [[17,20],[33,48],[51,55],[56,61]],                               // 20-15
  [[18,21],[32,50],[51,55],[57,61]],                               // 15-10
  [[21,24],[32,51],[56,62]],                                       // 10-5
  [[21,27],[33,50],[56,64]],                                       // 5-0
  [[21,29],[34,50],[56,65]],                                       // 0-5 S
  [[21,30],[34,49],[57,66]],                                       // 5-10
  [[22,31],[34,48],[58,67]],                                       // 10-15
  [[23,31],[34,47],[60,68]],                                       // 15-20  Australien
  [[24,31],[34,46],[59,68]],                                       // 20-25
  [[25,31],[35,45],[59,68]],                                       // 25-30
  [[25,30],[35,43],[60,67]],                                       // 30-35
  [[26,29],[61,65],[69,70]],                                       // 35-40  Neuseeland
  [[26,29],[69,71]],                                               // 40-45
  [[26,28]],                                                       // 45-50
  [[26,28]],                                                       // 50-55
  [[27,28]],                                                       // 55-60
  [],                                                              // 60-65
  [[0,12],[20,40],[48,72]],                                        // 65-70  Antarktisrand
  [[0,72]],                                                        // 70-75  Antarktis
  [[0,72]],                                                        // 75-80
  [[0,72]],                                                        // 80-85
  [[0,72]],                                                        // 85-90
];
function landKarte(latGrad, lonGrad){
  const zi = Math.floor((90 - latGrad) / 5);
  if(zi < 0 || zi >= ERDE_ZEILEN.length) return 0;
  let sp = Math.floor((lonGrad + 180) / 5);
  sp = ((sp % 72) + 72) % 72;
  for(const [a, b] of ERDE_ZEILEN[zi]) if(sp >= a && sp < b) return 1;
  return 0;
}
/* Geglättetes Landfeld: einmal berechnen, danach nur noch nachschlagen.
   Auflösung 1 Grad -> 360x180 Zellen. */
let LANDFELD = null;
function landFeld(){
  if(LANDFELD) return LANDFELD;
  const BX = 360, BY = 180;
  const f = new Float32Array(BX*BY);
  for(let y=0; y<BY; y++){
    const lat = 90 - (y + 0.5);
    for(let x=0; x<BX; x++){
      const lon = -180 + (x + 0.5);
      let summe = 0, gewicht = 0;
      for(let dy=-2; dy<=2; dy++){
        for(let dx=-2; dx<=2; dx++){
          const g = Math.exp(-(dx*dx + dy*dy)/3.0);
          gewicht += g;
          summe += g * landKarte(lat + dy*2.0, lon + dx*2.0);
        }
      }
      f[y*BX + x] = summe/gewicht;
    }
  }
  LANDFELD = f;
  return f;
}
function landWert(latGrad, lonGrad){             // bilinear nachschlagen
  const f = landFeld();
  const BX = 360, BY = 180;
  let fx = (lonGrad + 180) - 0.5;
  let fy = (90 - latGrad) - 0.5;
  fy = Math.max(0, Math.min(BY-1.001, fy));
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx - x0, ty = fy - y0;
  const wrap = (x) => ((x % BX) + BX) % BX;
  const a = f[y0*BX + wrap(x0)],       b = f[y0*BX + wrap(x0+1)];
  const c = f[(y0+1)*BX + wrap(x0)],   d = f[(y0+1)*BX + wrap(x0+1)];
  return (a*(1-tx) + b*tx)*(1-ty) + (c*(1-tx) + d*tx)*ty;
}
/* Küstenlinie: verzerrter Abtastpunkt + feine Fransen -> organische Umrisse */
function istLand(latRad, lonRad){
  let lat = latRad*180/Math.PI;
  let lon = lonRad*180/Math.PI;
  lon += (fbm(lonRad*2.4, latRad*2.9, 61, 3) - 0.5) * 10;
  lat += (fbm(lonRad*2.7 + 5, latRad*3.2, 67, 3) - 0.5) * 7;
  lat = Math.max(-89.9, Math.min(89.9, lat));
  const anteil = landWert(lat, ((lon + 180) % 360 + 360) % 360 - 180);
  const franse = (fbm(lonRad*16, latRad*19, 11, 3) - 0.5) * 0.16;
  return anteil + franse - 0.95;                 // >0 = Land (trifft die realen ~29% Landanteil)
}
/* Klimazonen als weiche Zentren [Länge°, Breite°, Ausdehnung Ost-West°, Nord-Süd°] */
const WUESTEN = [
  [  18,  20, 30, 12],   // Sahara
  [  46,  22, 12, 10],   // Arabien
  [ 105,  42, 22, 10],   // Gobi / Taklamakan
  [  21, -23, 10,  8],   // Kalahari / Namib
  [ 133, -25, 14,  8],   // Australiens Rotes Zentrum
  [ -69, -23,  4, 10],   // Atacama
  [-111,  35, 10,  7],   // Südwesten der USA
  [  64,  30, 10,  6],   // Thar / Iran
];
const REGENWALD = [
  [ -62,  -4, 16,  9],   // Amazonas
  [  20,   0, 14,  8],   // Kongo
  [ 115,   0, 25,  9],   // Indonesien / Neuguinea
];
function zonenWert(liste, lonG, latG){
  let w = 0;
  for(const [zl, zb, rx, ry] of liste){
    let dl = lonG - zl;
    while(dl >  180) dl -= 360;
    while(dl < -180) dl += 360;
    const db = latG - zb;
    const d = (dl*dl)/(rx*rx) + (db*db)/(ry*ry);
    w = Math.max(w, Math.exp(-d*1.3));           // weicher Gauß-Abfall, keine Kanten
  }
  return w;
}
function absLat_(x){ return Math.abs(x); }
function mix(a, b, t){ return [ a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t ]; }
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

/* Kraterfelder für Mond und Merkur (fest, damit nichts flackert) */
/* Die Mare der erdzugewandten Mondseite [Länge°, Breite°, Ost-West°, Nord-Süd°, Drehung] */
const MARE = [
  [ -55,  18, 26, 34,  0.10],   // Oceanus Procellarum
  [ -16,  34, 18, 13, -0.15],   // Mare Imbrium
  [  18,  28, 11,  9,  0.00],   // Mare Serenitatis
  [  30,   7, 13, 11,  0.25],   // Mare Tranquillitatis
  [  52,  -8, 10, 11,  0.00],   // Mare Fecunditatis
  [  59,  17,  8,  6,  0.00],   // Mare Crisium
  [  34, -15,  8,  8,  0.00],   // Mare Nectaris
  [ -17, -21, 12,  9,  0.10],   // Mare Nubium
  [ -39, -24,  7,  7,  0.00],   // Mare Humorum
  [ -10,  56, 34,  4,  0.05],   // Mare Frigoris
  [   4,  13,  6,  5,  0.00],   // Mare Vaporum
  [ -25,  -3,  7,  6,  0.00],   // Mare Cognitum / Insularum
];
/* Markante Krater [Länge°, Breite°, Radius°, Strahlensystem] */
const MONDKRATER = [
  [ -11, -43, 4.5, true ],      // Tycho - mit weitem Strahlensystem
  [ -20,  10, 3.2, true ],      // Copernicus
  [ -38,   8, 2.0, true ],      // Kepler
  [ -47,  24, 1.8, true ],      // Aristarchus (hell)
  [  -9,  51, 3.4, false],      // Plato (dunkler Boden)
  [ -68,  -6, 4.0, false],      // Grimaldi (dunkel)
  [  60, -20, 3.0, false],      // Langrenus
  [  24, -25, 3.6, false],      // Theophilus
  [  -2, -30, 4.2, false],      // Ptolemaeus
  [  40,  40, 2.6, false],      // Eudoxus
];
function marAnteil(latGrad, lonGrad){
  let best = 0;
  for(const [ml, mb, rx, ry, rot] of MARE){
    let dl = lonGrad - ml;
    while(dl >  180) dl -= 360;
    while(dl < -180) dl += 360;
    const db = latGrad - mb;
    const co = Math.cos(rot), si = Math.sin(rot);
    const x = ( dl*co + db*si) / rx;
    const y = (-dl*si + db*co) / ry;
    const d = Math.sqrt(x*x + y*y);
    if(d < 1.15) best = Math.max(best, 1 - d/1.15);
  }
  return best;
}

/* Krater nach Breitengrad einsortieren -> pro Bildpunkt nur wenige prüfen */
function kraterIndex(liste){
  const BIN = 0.08;                                  // Fachbreite in Radiant
  const N = Math.ceil(Math.PI/BIN) + 2;
  const faecher = Array.from({length:N}, () => []);
  for(const k of liste){
    const lo = Math.floor((k.lat + Math.PI/2 - k.r*1.5) / BIN);
    const hi = Math.floor((k.lat + Math.PI/2 + k.r*1.5) / BIN);
    for(let i=Math.max(0,lo); i<=Math.min(N-1,hi); i++) faecher[i].push(k);
  }
  return { faecher, BIN, N, strahlen: liste.filter(k => k.strahl) };
}
function kraterBei(idx, lat){
  const i = Math.floor((lat + Math.PI/2) / idx.BIN);
  return (i >= 0 && i < idx.N) ? idx.faecher[i] : [];
}

/* Höhenprofil eines Kraters: Schüssel + aufgeworfener Wall */
function kraterHoehe(q){
  const schuessel = q < 0.86 ? -(1 - (q/0.86)*(q/0.86)) : 0;
  const wall = 0.45 * Math.exp(-Math.pow((q - 0.98)/0.15, 2));
  return schuessel + wall;
}

/* Krater plastisch beleuchten (Licht von Nordwesten - wie auf Mondkarten) */
function kraterSchattierung(idx, lat, lon){
  let hell = 0;      // >0 heller, <0 dunkler
  let albedo = 0;    // Materialaufhellung (frischer Auswurf)
  const LU = -0.707, LV = 0.707;

  for(const k of kraterBei(idx, lat)){
    const db = lat - k.lat;
    if(Math.abs(db) > k.r*1.45) continue;             // schnelle Vorauswahl
    const dl = ((lon - k.lon + Math.PI*3) % (Math.PI*2)) - Math.PI;
    const du = dl * Math.cos(lat);
    const dist = Math.hypot(du, db);
    const q = dist / k.r;
    if(q > 1.35) continue;

    const ux = dist > 1e-6 ? du/dist : 0;
    const uy = dist > 1e-6 ? db/dist : 0;
    const zumLicht = ux*LU + uy*LV;                   // +1 = zur Lichtquelle hin

    // Steigung des Höhenprofils
    const dh = (kraterHoehe(q + 0.035) - kraterHoehe(q - 0.035)) / 0.07;

    // Wand, die vom Licht wegzeigt, wird hell; die zum Licht zeigende liegt im Schatten
    hell += -dh * zumLicht * 0.80 * k.tief;

    if(q < 0.80) albedo -= 0.09 * k.tief * (1 - q/0.80);            // Kraterboden
    if(q > 0.86 && q < 1.22)                                        // frischer Auswurf
      albedo += 0.11 * k.tief * Math.exp(-Math.pow((q-1.0)/0.12, 2));
  }
  return { hell, albedo };
}

function kraterFeld(anzahl, s){
  const k = [];
  for(let i=0;i<anzahl;i++){
    // Potenzverteilung wie in Wirklichkeit: sehr viele kleine, sehr wenige große
    const q = hash(i, s+90);
    const gross = Math.pow(q, 4.5);
    k.push({
      lon: (hash(i, s)*2-1) * Math.PI,
      lat: Math.asin(hash(i, s+50)*2-1),
      r:   0.006 + gross*0.055,        // klein -> wirkt als Textur, nicht als Fleck
      tief:0.55 + hash(i, s+130)*0.45,
      strahl: false
    });
  }
  return k;
}
/* Mond: Streufeld + benannte Krater. In den Mare liegen deutlich weniger Krater
   (die Basaltdecken sind jünger als das Hochland). */
function mondKrater(anzahl){
  const roh = kraterFeld(anzahl, 3);
  const k = [];
  for(let i=0;i<roh.length;i++){
    const c = roh[i];
    const m = marAnteil(c.lat*180/Math.PI, c.lon*180/Math.PI);
    if(m > 0.25 && hash(i, 555) > 0.18) continue;    // Mare bleiben weitgehend glatt
    if(m > 0.05){ c.r *= 0.6; c.tief *= 0.7; }       // am Beckenrand kleiner
    k.push(c);
  }
  for(const [ml, mb, rGrad, strahl] of MONDKRATER){
    k.push({
      lon: ml*Math.PI/180,
      lat: mb*Math.PI/180,
      r:   rGrad*Math.PI/180 * 1.7,
      tief: 1.0,
      strahl
    });
  }
  return k;
}

/* Oberflächenfarbe an einem Punkt der Kugel (Länge/Breite in Radiant) */
function surfaceColor(p, lat, lon, krater){
  const A = hex2rgb(p.a), B = hex2rgb(p.b), C = hex2rgb(p.c);
  const latN = lat / (Math.PI/2);                 // -1 .. 1

  if(p.art === 'baender' || p.art === 'ringe' || p.art === 'ringe_v' || p.art === 'schleier'){
    // Gasplanet: Bänder nach Breitengrad, durch Turbulenz verwirbelt
    const wirbel = p.art === 'ringe_v' ? 0.10          // Uranus ist fast strukturlos
                 : p.art === 'schleier' ? 0.55         // Venus: weiche Schleier
                 : 0.32;
    const dichte = p.art === 'ringe_v' ? 3 : p.art === 'schleier' ? 5 : 9;
    const turb = (fbm(lon*2.2, lat*7, 3, 4) - 0.5) * wirbel;
    const band = Math.sin((latN + turb) * dichte * Math.PI/2);
    const fein = (fbm(lon*6, lat*22, 8, 3) - 0.5) * 0.35;
    let t = (band*0.5 + 0.5) + fein;
    t = Math.max(0, Math.min(1, t));
    let col = t < 0.5 ? mix(A, B, t*2) : mix(B, C, (t-0.5)*2);

    // Großer Fleck (Jupiter/Neptun)
    if(p.fleck){
      const flon = -0.9, flat = -0.30;
      const dl = Math.abs(((lon - flon + Math.PI*3) % (Math.PI*2)) - Math.PI);
      const dx = dl/0.55, dy = (lat - flat)/0.22;
      const dd = dx*dx + dy*dy;
      if(dd < 1){
        const wirbelF = fbm(Math.atan2(dy,dx)*3, dd*6, 21, 3);
        const kraft = (1 - dd) * (0.55 + wirbelF*0.5);
        col = mix(col, hex2rgb(p.fleck), Math.min(1, kraft));
      }
    }
    return col;
  }

  if(p.art === 'kappen'){                         // Mars
    const albedo = fbm(lon*2.6, lat*4.5, 5, 5);
    let col = mix(B, C, Math.max(0, Math.min(1, albedo*1.4 - 0.2)));
    if(albedo < 0.42) col = mix(col, A, (0.42-albedo)*2.2);   // dunkle Regionen (Syrtis Major)
    const eis = Math.abs(latN);
    if(eis > 0.86){
      const rand = fbm(lon*7, 0, 9, 2)*0.06;
      if(eis > 0.88 + rand) col = mix(col, [245,248,255], 0.85);
    }
    return col;
  }

  if(p.art === 'erde'){
    const lonD = lon + 0.50;                      // Blick auf Afrika/Europa
    const latG = lat*180/Math.PI;
    const lonG = ((lonD*180/Math.PI + 180) % 360 + 360) % 360 - 180;
    const land = istLand(lat, lonD);
    let col;

    if(land > 0){
      const inland = Math.min(1, land*3.0);
      // sanftes Relief - deutlich weniger Kontrast als zuvor (keine Sprenkel)
      const relief = 0.5 + (fbm(lonD*9, lat*11, 19, 4) - 0.5) * 0.55;
      const absLat = Math.abs(latG);

      const wueste    = zonenWert(WUESTEN,   lonG, latG);
      const regenwald = zonenWert(REGENWALD, lonG, latG);

      // Grundvegetation nach Breitengrad, weich ineinander übergehend
      let basis;
      if(absLat > 60){
        const k = Math.min(1, (absLat - 60)/12);
        basis = mix([70,104,74], [206,214,220], k);          // Nadelwald -> Tundra
      } else if(absLat > 42){
        const k = (absLat - 42)/18;
        basis = mix([74,116,70], [56,96,64], k);             // Mischwald -> Nadelwald
      } else {
        basis = mix([88,130,74], [104,134,80], relief);      // Grasland / Mischwald
      }
      // Zonen weich darüberblenden
      col = basis;
      if(regenwald > 0.05)
        col = mix(col, mix([32,96,46],[54,124,58], relief), Math.min(0.85, regenwald));
      if(wueste > 0.05)
        col = mix(col, mix([200,174,122],[224,202,152], relief), Math.min(0.88, wueste));

      if(relief > 0.68 && absLat < 62)                        // Gebirge
        col = mix(col, [146,138,124], (relief-0.68)*2.2);
      if(inland < 0.30)                                       // Küstensaum
        col = mix(col, [126,152,112], (0.30-inland)*1.2);
    } else {
      const tiefe = Math.min(1, -land*2.2);
      col = mix([78,166,214], hex2rgb(p.a), tiefe);           // Schelf -> Tiefsee
      const grund = 0.5 + (fbm(lonD*4, lat*5, 29, 3) - 0.5)*0.5;
      if(tiefe > 0.7) col = mix(col, [10,32,74], (tiefe-0.7)*1.8*grund);
    }

    // Eiskappen
    const absL = Math.abs(latG);
    if(absL > 64){
      const k = Math.min(1, (absL - 64)/14);
      const rand = (fbm(lonD*7, 0, 13, 3) - 0.5) * 0.35;
      col = mix(col, [240,247,255], Math.max(0, Math.min(0.95, k + rand)));
    }

    // Wolken: Äquatorband, Westwindzone, klarere Subtropen
    const wolkeN = fbm(lonD*3.2 + 4.0, lat*4.4, 17, 5);
    const fein   = fbm(lonD*8 + 1.0, lat*10, 27, 3);
    const itcz   = Math.exp(-Math.pow(latG/8, 2)) * 0.20;
    const west   = Math.exp(-Math.pow((absLat_(latG)-55)/15, 2)) * 0.18;
    const subtrop= Math.exp(-Math.pow((absLat_(latG)-25)/12, 2)) * 0.10;
    const schwelle = 0.40 - itcz - west + subtrop;
    const w = wolkeN*0.80 + fein*0.20;
    if(w > schwelle)
      col = mix(col, [250,252,255], Math.min(0.90, (w - schwelle)*2.8));
    return col;
  }

  if(p.art === 'krater'){                         // Mond und Merkur
    const latG = lat*180/Math.PI;
    const lonG = lon*180/Math.PI;
    // ruhiges Grundrelief - vorher zu kontrastreich und dadurch fleckig
    const grund = 0.5 + (fbm(lon*5, lat*7, 23, 5) - 0.5) * 0.45;
    let col = mix(B, C, grund*0.75 + 0.18);

    if(p.maria){                                  // Mond: echte Mare, weich auslaufend
      const m = marAnteil(latG, lonG);
      if(m > 0){
        const rand = (fbm(lon*4, lat*5, 47, 3) - 0.5) * 0.20;   // unregelmäßige Beckenränder
        const k = Math.max(0, Math.min(1, (m + rand - 0.06) * 2.4));
        const g2 = k*k*(3 - 2*k);                                // weicher Übergang
        const basalt = 0.5 + (fbm(lon*7, lat*8, 33, 3) - 0.5)*0.4;
        const dunkel = mix(A, mix(A, B, 0.32), basalt);
        col = mix(col, dunkel, g2*0.90);
      }
    } else {                                      // Merkur: Ebenen und Steilhänge
      const m = fbm(lon*2.2, lat*2.8, 31, 3);
      if(m > 0.58) col = mix(col, A, Math.min(0.55, (m-0.58)*2.4));
    }

    // Strahlensysteme (heller Auswurf, liegt unter der Kraterplastik)
    for(const k of krater.strahlen){
      const db0 = lat - k.lat;
      const reich = k.r*10;
      if(Math.abs(db0) > reich) continue;
      const dl0 = ((lon - k.lon + Math.PI*3) % (Math.PI*2)) - Math.PI;
      if(Math.abs(dl0) > reich*1.6) continue;
      const d = Math.hypot(dl0*Math.cos(lat), db0);
      if(d < reich && d > k.r){
        const w = Math.atan2(db0, dl0);
        const strahl = fbm(w*8, d*2.5, 41, 3);
        if(strahl > 0.60){
          const staerke = (strahl-0.60)*1.4 * Math.pow(1 - d/reich, 1.9);
          col = mix(col, [236,236,244], Math.min(0.40, staerke));
        }
      }
    }

    // Krater: plastische Beleuchtung statt flacher Ringe
    const ks = kraterSchattierung(krater, lat, lon);
    if(ks.albedo !== 0){
      const ziel = ks.albedo > 0 ? C : A;
      col = mix(col, ziel, Math.min(0.55, Math.abs(ks.albedo)));
    }
    if(ks.hell !== 0){
      const f = Math.max(-0.62, Math.min(0.62, ks.hell));
      col = [ col[0]*(1+f), col[1]*(1+f), col[2]*(1+f) ];
    }
    return col;
  }

  if(p.art === 'sonne'){                          // Granulation und Flecken
    const gran = fbm(lon*14, lat*20, 51, 4);
    const supergran = fbm(lon*4, lat*6, 61, 3);
    let col = mix(B, C, Math.max(0, Math.min(1, gran*0.7 + supergran*0.5)));
    const fleck = fbm(lon*2.2, lat*3.0, 71, 3);
    if(fleck > 0.70){                             // Sonnenfleck mit Penumbra
      const k = (fleck - 0.70)/0.30;
      col = mix(col, [140,60,10], Math.min(0.75, k*1.4));
      if(fleck > 0.80) col = mix(col, [60,20,5], (fleck-0.80)*5);
    }
    return col;
  }

  return B;
}

/* Kugel Pixel für Pixel berechnen - einmal pro Level, danach zwischengespeichert */
let planetCache = null, planetKey = '';
const TEX_SCALE = 0.58;        // Textur in reduzierter Auflösung -> deutlich schneller

function ensurePlanet(){
  const p = planetFor(level);
  // Mond und Erde kennt jeder auswendig -> volle Auflösung
  const skala = p.detail ? 0.80 : TEX_SCALE;
  const R = Math.max(24, Math.round(W*0.30*skala));
  const key = p.name + '|' + R;
  if(key === planetKey && planetCache) return;
  try{ planetCache = buildPlanet(p, R); planetKey = key; }catch(_){ planetCache = null; }
}
function buildPlanet(p, R){
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = R*2;
  const c = cnv.getContext('2d');
  const img = c.createImageData(R*2, R*2);
  const D = img.data;

  const krater = p.art === 'krater'
    ? kraterIndex(p.maria ? mondKrater(p.kraterZahl || 16) : kraterFeld(p.kraterZahl || 16, 77))
    : null;

  // Lichtrichtung: von oben links
  const Lx = -0.50, Ly = -0.52, Lz = 0.69;
  const istSonne = p.art === 'sonne';

  for(let py=0; py<R*2; py++){
    for(let px=0; px<R*2; px++){
      const nx = (px - R + 0.5)/R;
      const ny = (py - R + 0.5)/R;
      const d2 = nx*nx + ny*ny;
      const i = (py*R*2 + px)*4;
      if(d2 > 1){ D[i+3] = 0; continue; }

      const nz = Math.sqrt(1 - d2);
      const lat = Math.asin(Math.max(-1, Math.min(1, -ny)));   // Norden oben
      const lon = Math.atan2(nx, nz);

      let col = surfaceColor(p, lat, lon, krater);

      let lum;
      if(istSonne){
        lum = 0.72 + 0.42*Math.pow(nz, 0.42);         // Randverdunkelung der Photosphäre
      } else {
        const diff = Math.max(0, nx*Lx + ny*Ly + nz*Lz);
        lum = 0.10 + 1.05*Math.pow(diff, 0.85);       // Tag/Nacht mit weichem Terminator
      }

      let r = col[0]*lum, g = col[1]*lum, b = col[2]*lum;

      // Atmosphärenrand (blauer Saum bei Erde, Dunst bei Mars/Venus/Gasriesen)
      if(p.atmo && nz < 0.34){
        const saum = Math.pow(1 - nz/0.34, 2.2);
        const at = hex2rgb(p.atmo);
        const diff = Math.max(0, nx*Lx + ny*Ly + nz*Lz);
        const k = saum * 0.75 * (0.25 + diff);
        r += (at[0]-r)*k; g += (at[1]-g)*k; b += (at[2]-b)*k;
      }

      D[i]   = Math.max(0, Math.min(255, r));
      D[i+1] = Math.max(0, Math.min(255, g));
      D[i+2] = Math.max(0, Math.min(255, b));
      D[i+3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
  return cnv;
}

function drawPlanet(t){
  const p = planetFor(level);
  const beringt = (p.art === 'ringe' || p.art === 'ringe_v');

  // Seite wechselt mit jedem Level - und zusätzlich mit jedem Zyklus,
  // damit nicht jeder Planet immer auf derselben Seite steht
  const rechts = ((level + Math.floor((level-1)/10)) % 2) === 1;

  // Ringplaneten rücken näher zur Mitte und sind kleiner, sonst läuft der Ring aus dem Bild
  const r  = beringt ? W*0.235 : W*0.30;
  const cx = beringt ? (rechts ? W*0.60 : W*0.40)
                     : (rechts ? W*0.74 : W*0.26);
  const cy = beringt ? H*0.19 : H*0.20;
  const istSonne = p.art === 'sonne';

  ensurePlanet();

  ctx.save();

  /* --- Korona / Lichthof --- */
  const flimmer = istSonne ? (1 + Math.sin(t*2.2)*0.04) : 1;
  const hofR = r*(istSonne ? 2.4 : 1.75)*flimmer;
  ctx.globalAlpha = istSonne ? 0.9 : 0.55;
  const hof = ctx.createRadialGradient(cx, cy, r*0.92, cx, cy, hofR);
  hof.addColorStop(0, `rgba(${p.glow},${istSonne ? .60 : .28})`);
  if(istSonne) hof.addColorStop(0.40, 'rgba(255,130,25,.20)');
  hof.addColorStop(1, `rgba(${p.glow},0)`);
  ctx.fillStyle = hof;
  ctx.beginPath(); ctx.arc(cx, cy, hofR, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  /* --- Protuberanzen (Sonne): weiche Gasfahnen am Rand --- */
  if(istSonne){
    for(let i=0;i<6;i++){
      const w    = hash(i,30)*Math.PI*2 + t*0.03;
      const puls = 1 + Math.sin(t*1.6 + i*2.1)*0.28;
      const hoch = r*(0.10 + hash(i,31)*0.16) * puls;      // Höhe der Fahne
      const breit= 0.10 + hash(i,32)*0.13;                 // Winkelbreite

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(w);
      // Fahne: sitzt auf dem Rand und wölbt sich nach außen
      const g2 = ctx.createRadialGradient(r*0.98, 0, 1, r*0.98, 0, hoch*2.2);
      g2.addColorStop(0,   'rgba(255,190,90,.75)');
      g2.addColorStop(0.5, 'rgba(255,120,30,.35)');
      g2.addColorStop(1,   'rgba(255,80,20,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(r*0.96*Math.cos(-breit), r*0.96*Math.sin(-breit));
      ctx.quadraticCurveTo(r + hoch*1.5, 0, r*0.96*Math.cos(breit), r*0.96*Math.sin(breit));
      ctx.arc(0, 0, r*0.96, breit, -breit, true);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* --- Ringe hinter der Kugel --- */
  if(p.art === 'ringe' || p.art === 'ringe_v') zeichneRinge(p, cx, cy, r, true);

  /* --- Die Kugel --- */
  if(planetCache){
    ctx.drawImage(planetCache, cx - r, cy - r, r*2, r*2);
  }

  /* --- Ringe vor der Kugel --- */
  if(p.art === 'ringe' || p.art === 'ringe_v') zeichneRinge(p, cx, cy, r, false);

  /* --- Schatten des Planeten auf die Ringe (Licht kommt von oben links) --- */
  if(p.art === 'ringe'){
    ctx.save();
    // Nur außerhalb der Kugel zeichnen - der Schatten liegt auf den Ringen, nicht auf dem Planeten
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(cx, cy, r*1.005, 0, Math.PI*2);
    ctx.clip('evenodd');

    ctx.translate(cx, cy);
    ctx.rotate(-0.32);
    ctx.globalAlpha = 0.62;
    ctx.strokeStyle = '#080A18';
    ctx.lineWidth = r*0.60;                    // deckt die Ringbreite ab
    ctx.beginPath();
    // Licht kommt von oben links -> Schatten fällt nach rechts unten
    ctx.ellipse(0, 0, r*1.42, r*1.42*0.22, 0, 0.05, 0.40);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* Ringsystem mit Cassini-Teilung und Schatten des Planeten */
function zeichneRinge(p, cx, cy, r, hinten){
  const saturn = p.art === 'ringe';
  const neig = saturn ? -0.32 : 1.30;          // Uranus steht fast senkrecht
  // Ringe: [relativer Radius, Breite, Deckkraft]
  const ringe = saturn
    ? [[1.16,0.10,0.30],[1.28,0.16,0.75],[1.46,0.03,0.06],[1.53,0.13,0.55],[1.72,0.05,0.22]]  // C, B, Cassini, A, F
    : [[1.30,0.015,0.55],[1.38,0.010,0.35],[1.50,0.022,0.65]];                                 // schmale, dunkle Ringe

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(neig);
  for(const [rad, breite, deck] of ringe){
    ctx.globalAlpha = deck * (hinten ? 0.55 : 1);
    ctx.strokeStyle = saturn ? p.c : '#8FB6C4';
    ctx.lineWidth = r*breite;
    ctx.beginPath();
    ctx.ellipse(0, 0, r*rad, r*rad*0.22, 0,
                hinten ? Math.PI : 0, hinten ? Math.PI*2 : Math.PI);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- Meteoriten ---------- */
function spawnMeteor(){
  const size = W * 0.082;
  const margin = size*0.6;
  const d = difficulty();
  let x;

  if(Math.random() < d.aimChance){
    // gezielt in die Nähe des Schiffs -> an derselben Stelle bleiben lohnt nicht
    x = ship.x + (Math.random()-0.5)*ship.w*1.7;
    x = Math.min(Math.max(x, margin), W - margin);
  } else {
    // zufällig, aber nicht direkt neben dem letzten Spawn -> es bleiben Lücken
    let tries=0;
    do {
      x = margin + Math.random()*(W - margin*2);
      tries++;
    } while (Math.abs(x - lastSpawnX) < ship.w*1.05 && tries < 8);
  }
  lastSpawnX = x;

  meteors.push({
    x, y:-size,
    size,
    speed: d.fallSpeed * (0.9 + Math.random()*0.25),
    emoji: emojiFor(level),
    rot: (Math.random()-0.5)*0.6,
    rotSpeed: (Math.random()-0.5)*1.6,
    hit: size*0.32
  });
}

/* ---------- Kamikaze-Gegner ---------- */
function enemyParams(){
  const p = Math.min((level-1)/49, 1);          // 0..1 über 50 Level
  return {
    diveSpeed: H*(0.48 + p*0.42),               // vertikales Tempo
    maxVX:     W*(0.32 + p*0.42),               // max. seitliche Nachführung (etwas fieser)
    accelX:    W*(1.7  + p*2.2),                // wie schnell es nachzieht
    lockDist:  H*(0.22 - p*0.13)                // ab dieser Nähe festgelegt -> spätes Ausweichen wirkt
  };
}
function buildEnemySchedule(){
  enemies = []; enemyIdx = 0; enemySchedule = [];
  const count = Math.floor((level-1)/10) + 1;   // 1x in Lvl 1–10, 2x in 11–20, ...
  const startW = 2.5, endW = LEVEL_TIME - 2.5;
  const span = (endW - startW) / count;
  for(let i=0;i<count;i++){
    enemySchedule.push(startW + span*(i + 0.3 + Math.random()*0.4));
  }
}
function spawnEnemy(){
  const size = ship.w * 1.05;
  let ex = ship.x + (Math.random()-0.5)*W*0.32;               // grob in Spielernähe einfliegen
  ex = Math.min(Math.max(ex, size*0.5), W - size*0.5);
  enemies.push({
    x:ex, y:-size*0.8, vx:0, vy:enemyParams().diveSpeed,
    size, hit:size*0.33, ang:0, scored:false
  });
  startSturzflug(enemies[enemies.length-1]);
}
function updateEnemies(dt){
  const pr = enemyParams();
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    // seitliche Verfolgung nur oberhalb der Sperrdistanz -> danach festgelegt
    if(e.y < ship.y - pr.lockDist){
      e.vx += Math.sign(ship.x - e.x) * pr.accelX * dt;
      e.vx = Math.max(-pr.maxVX, Math.min(pr.maxVX, e.vx));
    }
    e.vy = pr.diveSpeed;
    e.x += e.vx*dt;
    e.y += e.vy*dt;
    e.ang = Math.atan2(e.vx, e.vy);            // Neigung in Flugrichtung
    if(e.x < e.size*0.4){ e.x=e.size*0.4; e.vx=Math.abs(e.vx)*0.4; }
    if(e.x > W-e.size*0.4){ e.x=W-e.size*0.4; e.vx=-Math.abs(e.vx)*0.4; }

    // Kollision -> Leben verlieren (oder am Schild zerschellen)
    if(invuln <= 0){
      const dx=e.x-ship.x, dy=e.y-ship.y;
      if(shield > 0){
        const rs = e.hit + shieldR();
        if(dx*dx+dy*dy < rs*rs){ stopSturzflug(e); explode(e.x,e.y); enemies.splice(i,1); score += 3; updateHUD(); continue; }
      } else {
        const rr = e.hit + ship.w*0.34;
        if(dx*dx+dy*dy < rr*rr){ stopSturzflug(e); explode(e.x,e.y); enemies.splice(i,1); die(); return; }
      }
    }
    // unten raus -> erfolgreich ausgewichen
    if(e.y - e.size > H){
      if(!e.scored){ score += 3; updateHUD(); }
      stopSturzflug(e);
      enemies.splice(i,1);
    }
  }
}
function drawEnemy(e){
  const w = e.size;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.ang);
  // Glühen
  ctx.save(); ctx.globalAlpha=.4;
  const g=ctx.createRadialGradient(0,0,2,0,0,w*0.7);
  g.addColorStop(0,'rgba(255,70,70,.9)'); g.addColorStop(1,'rgba(255,70,70,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,w*0.7,0,Math.PI*2); ctx.fill(); ctx.restore();
  // Antriebsflamme (nach hinten/oben)
  ctx.save(); ctx.globalAlpha=.9;
  const fl=ctx.createLinearGradient(0,-w*0.2,0,-w*0.8);
  fl.addColorStop(0,'#FFD23F'); fl.addColorStop(1,'rgba(255,120,60,0)');
  ctx.fillStyle=fl;
  ctx.beginPath(); ctx.moveTo(-w*0.13,-w*0.2); ctx.lineTo(0,-w*0.82); ctx.lineTo(w*0.13,-w*0.2); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Rumpf (Pfeil nach unten)
  const body=ctx.createLinearGradient(0,-w*0.3,0,w*0.5);
  body.addColorStop(0,'#FF6B5B'); body.addColorStop(1,'#A81C26');
  ctx.fillStyle=body;
  ctx.beginPath();
  ctx.moveTo(0,w*0.5);
  ctx.lineTo(-w*0.42,-w*0.16);
  ctx.lineTo(-w*0.16,-w*0.04);
  ctx.lineTo(-w*0.16,-w*0.32);
  ctx.lineTo(w*0.16,-w*0.32);
  ctx.lineTo(w*0.16,-w*0.04);
  ctx.lineTo(w*0.42,-w*0.16);
  ctx.closePath(); ctx.fill();
  // böses Auge
  ctx.fillStyle='#2A0A0A';
  ctx.beginPath(); ctx.ellipse(0,w*0.05,w*0.12,w*0.16,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFE24D';
  ctx.beginPath(); ctx.ellipse(0,w*0.09,w*0.06,w*0.09,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Farbpalette der Kanonenkugeln */
const KUGEL_FARBEN = {
  gelb: { kern:'#FFF7CC', mitte:'#FFD24D', rand:'#E08A00', glow:'255,190,60' },
  rot:  { kern:'#FFE2DA', mitte:'#FF7A5C', rand:'#C22B1B', glow:'255,95,60'  },
  blau: { kern:'#E0EDFF', mitte:'#5BA8FF', rand:'#1B47C4', glow:'90,160,255' },
  gruen:{ kern:'#E2FCEA', mitte:'#4ADE80', rand:'#12703A', glow:'80,220,130' },
  orange:{kern:'#FFF3C4', mitte:'#FFB03A', rand:'#E2530B', glow:'255,150,45' },  // nur Nova
};
// Kanonenkugeln: gelb, rot, blau, grün (Orange bleibt der Nova vorbehalten)
const FARB_NAMEN = ['gelb','rot','blau','gruen'];

/* Leuchtkugel zeichnen (für Nova und Kanonenkugeln) */
function drawKugel(x, y, s, farbe, t, blinkend){
  const c = KUGEL_FARBEN[farbe];
  const puls = blinkend ? (0.55 + 0.45*Math.abs(Math.sin(t*9))) : (0.75 + 0.25*Math.abs(Math.sin(t*5)));
  ctx.save();
  ctx.translate(x, y);

  // Glühen
  ctx.globalAlpha = puls*0.8;
  const halo = ctx.createRadialGradient(0,0,s*0.4, 0,0,s*4.2);
  halo.addColorStop(0,   `rgba(${c.glow},.95)`);
  halo.addColorStop(0.35,`rgba(${c.glow},.50)`);
  halo.addColorStop(1,   `rgba(${c.glow},0)`);
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0,0,s*4.2,0,Math.PI*2); ctx.fill();

  // Kugelkörper
  ctx.globalAlpha = 1;
  const orb = ctx.createRadialGradient(-s*0.22,-s*0.26,s*0.06, 0,0,s*0.72);
  orb.addColorStop(0,    c.kern);
  orb.addColorStop(0.38, c.mitte);
  orb.addColorStop(1,    c.rand);
  ctx.fillStyle = orb;
  ctx.beginPath(); ctx.arc(0,0,s*0.72,0,Math.PI*2); ctx.fill();

  // pulsierender Ring
  ctx.globalAlpha = puls;
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = Math.max(1.5, s*0.12);
  ctx.beginPath(); ctx.arc(0,0,s*0.72,0,Math.PI*2); ctx.stroke();

  // Glanzpunkt
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(-s*0.26,-s*0.28, s*0.16, s*0.10, -0.6, 0, Math.PI*2); ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- Comic-Kanone am Bildschirmrand ---------- */
function cannonParams(){
  const p = Math.min((level-1)/49, 1);
  return {
    aimTime:    1.5 - p*0.55,       // deutlich sichtbares Zielen vor dem Schuss
    bulletSpeed: W*(0.50 + p*0.35), // Geschossgeschwindigkeit
    holdTime:   0.8                 // bleibt nach dem Schuss noch kurz stehen
  };
}
function buildCannonSchedule(){
  cannons = []; bullets = []; cannonIdx = 0; cannonSchedule = [];
  if(level < 3) return;                       // erst ab Level 3
  const count = 2;                            // 2x pro Runde
  const startW = 2.0, endW = LEVEL_TIME - 2.0;
  const span = (endW - startW) / count;
  for(let i=0;i<count;i++){
    cannonSchedule.push(startW + span*(i + 0.25 + Math.random()*0.5));
  }
}
function spawnCannon(){
  const side = Math.random() < 0.5 ? -1 : 1;  // -1 = links, 1 = rechts
  const size = W * 0.16;                      // deutlich sichtbar
  const pr = cannonParams();
  cannons.push({
    side, size,
    x: side < 0 ? size*0.42 : W - size*0.42,  // vollständig im Bild
    y: H * (0.42 + Math.random()*0.16),       // etwa mittig am Rand
    t: 0,
    aim: pr.aimTime,
    angle: side < 0 ? 0 : Math.PI,
    fired: false,
    hold: pr.holdTime,
    recoil: 0,
    pop: 0                                     // Auftauch-Animation
  });
  startSirren(cannons[cannons.length-1], pr.aimTime);
}
function updateCannons(dt){
  const pr = cannonParams();
  for(let i=cannons.length-1;i>=0;i--){
    const c = cannons[i];
    c.t += dt;
    c.pop = Math.min(1, c.pop + dt*6);
    if(!c.fired){
      // sichtbar auf das Schiff zielen
      const target = Math.atan2(ship.y - c.y, ship.x - c.x);
      let diff = target - c.angle;
      while(diff >  Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      c.angle += diff * Math.min(1, dt*7);
      c.aim -= dt;
      if(c.aim <= 0){
        // auf die AKTUELLE Position feuern, danach fliegt das Geschoss geradeaus
        const a = Math.atan2(ship.y - c.y, ship.x - c.x);
        c.angle = a;
        c.fired = true;
        c.recoil = 1;
        stopSirren(c);
        sfxKanone();
        const bs = pr.bulletSpeed;
        const bSize = W*0.05;                 // doppelt so groß wie die Nova (W*0.025)
        bullets.push({
          x: c.x + Math.cos(a)*c.size*0.55,
          y: c.y + Math.sin(a)*c.size*0.55,
          vx: Math.cos(a)*bs, vy: Math.sin(a)*bs,
          size: bSize,
          hit: bSize*0.72,                    // Trefferzone = sichtbarer Kugelrand
          farbe: FARB_NAMEN[(Math.random()*FARB_NAMEN.length)|0],
          t: 0
        });
      }
    } else {
      c.recoil = Math.max(0, c.recoil - dt*4);
      c.hold -= dt;
      if(c.hold <= 0){ stopSirren(c); cannons.splice(i,1); }
    }
  }
}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.t += dt;
    if(invuln <= 0 && shield <= 0){
      const dx=b.x-ship.x, dy=b.y-ship.y, rr=b.hit+ship.w*0.34;
      if(dx*dx+dy*dy < rr*rr){ explode(b.x,b.y); bullets.splice(i,1); die(); return; }
    } else if(shield > 0){
      const dx=b.x-ship.x, dy=b.y-ship.y, rr=b.hit+shieldR();
      if(dx*dx+dy*dy < rr*rr){ explode(b.x,b.y); bullets.splice(i,1); continue; }
    }
    const m = b.size*1.5;
    if(b.x < -m || b.x > W+m || b.y < -m || b.y > H+m) bullets.splice(i,1);
  }
}
function drawCannon(c){
  const s = c.size;
  const sc = 0.5 + 0.5*c.pop;                 // taucht auf

  // gestrichelte Ziellinie vor dem Schuss
  if(!c.fired){
    ctx.save();
    ctx.globalAlpha = 0.30 + 0.30*Math.abs(Math.sin(c.t*10));
    ctx.strokeStyle = '#FF6B8B';
    ctx.lineWidth = Math.max(2, s*0.035);
    ctx.setLineDash([s*0.10, s*0.12]);
    ctx.beginPath();
    ctx.moveTo(c.x + Math.cos(c.angle)*s*0.6, c.y + Math.sin(c.angle)*s*0.6);
    ctx.lineTo(c.x + Math.cos(c.angle)*W*1.4, c.y + Math.sin(c.angle)*W*1.4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* --- Drehbares Rohr (verchromt, segmentiert) --- */
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(sc, sc);
  ctx.rotate(c.angle);
  if(c.recoil > 0) ctx.translate(-c.recoil*s*0.16, 0);

  // Rohrkörper mit Chromverlauf (hell oben, dunkel unten)
  const chrom = ctx.createLinearGradient(0,-s*0.17,0,s*0.17);
  chrom.addColorStop(0.00,'#6F7796');
  chrom.addColorStop(0.28,'#E8EDFA');
  chrom.addColorStop(0.50,'#B9C3DC');
  chrom.addColorStop(0.72,'#7E88A8');
  chrom.addColorStop(1.00,'#4C5470');
  ctx.fillStyle = chrom;
  ctx.beginPath();
  ctx.moveTo(0,      -s*0.17);
  ctx.lineTo(s*0.50, -s*0.15);
  ctx.lineTo(s*0.66, -s*0.13);   // leicht konisch zur Mündung
  ctx.lineTo(s*0.66,  s*0.13);
  ctx.lineTo(s*0.50,  s*0.15);
  ctx.lineTo(0,       s*0.17);
  ctx.closePath(); ctx.fill();

  // Kühlrippen auf dem Rohr (wie beim Schutzschirm-Motor)
  ctx.fillStyle = 'rgba(30,45,75,.45)';
  for(let i=0;i<3;i++){
    ctx.fillRect(s*0.10 + i*s*0.12, -s*0.16, s*0.035, s*0.32);
  }
  // Glanzkante
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(s*0.02, -s*0.115, s*0.60, s*0.022);

  // Mündungsring
  ctx.fillStyle = '#2E3550';
  ctx.beginPath(); ctx.ellipse(s*0.66, 0, s*0.055, s*0.13, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#C9D3E8';
  ctx.lineWidth = s*0.022;
  ctx.beginPath(); ctx.ellipse(s*0.66, 0, s*0.055, s*0.13, 0, 0, Math.PI*2); ctx.stroke();

  // Mündungsblitz
  if(c.recoil > 0.2){
    ctx.globalAlpha = c.recoil;
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath(); ctx.arc(s*0.72, 0, s*0.20*c.recoil, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  /* --- Feste Lafette: eckiger Chromsockel --- */
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(sc, sc);

  // achteckige Grundplatte
  const platte = ctx.createLinearGradient(0,-s*0.34,0,s*0.34);
  platte.addColorStop(0.00,'#D6DEF0');
  platte.addColorStop(0.42,'#8E99B8');
  platte.addColorStop(0.60,'#5C6584');
  platte.addColorStop(1.00,'#39405C');
  ctx.fillStyle = platte;
  ctx.beginPath();
  const r = s*0.34, k = r*0.42;
  ctx.moveTo(-k,-r); ctx.lineTo(k,-r); ctx.lineTo(r,-k); ctx.lineTo(r,k);
  ctx.lineTo(k,r);   ctx.lineTo(-k,r); ctx.lineTo(-r,k); ctx.lineTo(-r,-k);
  ctx.closePath(); ctx.fill();

  // Kanten-Highlight
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = Math.max(1, s*0.02);
  ctx.stroke();

  // Schraubbolzen
  ctx.fillStyle = '#2B3149';
  for(const [bx,by] of [[-r*0.62,-r*0.62],[r*0.62,-r*0.62],[-r*0.62,r*0.62],[r*0.62,r*0.62]]){
    ctx.beginPath(); ctx.arc(bx,by,s*0.028,0,Math.PI*2); ctx.fill();
  }

  // Energiekern in der Mitte (blau wie der Motor - rot blinkend beim Zielen)
  const zielt = !c.fired;
  const puls = 0.45 + 0.55*Math.abs(Math.sin(c.t*(zielt ? 14 : 4)));
  const kernFarbe = zielt ? '255,77,77' : '90,180,255';
  ctx.globalAlpha = puls;
  const kern = ctx.createRadialGradient(0,0,s*0.02, 0,0,s*0.17);
  kern.addColorStop(0, `rgba(255,255,255,.95)`);
  kern.addColorStop(0.4, `rgba(${kernFarbe},.95)`);
  kern.addColorStop(1, `rgba(${kernFarbe},0)`);
  ctx.fillStyle = kern;
  ctx.beginPath(); ctx.arc(0,0,s*0.17,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Kernfassung
  ctx.strokeStyle = '#AEB9D4';
  ctx.lineWidth = s*0.026;
  ctx.beginPath(); ctx.arc(0,0,s*0.115,0,Math.PI*2); ctx.stroke();

  ctx.restore();
}

/* ---------- Power-up: Motor in der Blase (Schutzschirm) ---------- */
function shieldR(){ return ship.w * 1.15; }   // deutlich größer als das Schiff
function spawnPowerup(type){
  const isNova = type === 'nova';
  const size = isNova ? W*0.025 : W*0.15;   // Nova: klein und schwer zu erwischen
  powerups.push({
    type,
    x: size*3 + Math.random()*(W - size*6),
    y: -size*3,
    size,
    speed: H*0.30 * (isNova ? 1.5 : 1),     // Nova fällt 1,5x so schnell
    bob: Math.random()*Math.PI*2,
    t: 0
  });
  if(isNova) startNovaSirene(powerups[powerups.length-1]);
}
/* Nova: alle Feindobjekte explodieren lassen */
function detonateAll(){
  let pts = 0;
  // Einzelexplosionen bleiben optisch, aber stumm - stattdessen EIN schwerer Knall
  for(const m of meteors){ explode(m.x, m.y, 1, true); pts += 1; }
  for(const b of bullets){ explode(b.x, b.y, 1, true); pts += 1; }
  for(const e of enemies){ stopSturzflug(e); explode(e.x, e.y, 1, true); pts += 3; }
  for(const c of cannons){ stopSirren(c); }
  sfxNovaKnall();
  meteors = []; bullets = []; enemies = []; cannons = [];
  flash = 0.35;
  score += pts + 10;
  updateHUD();
}
function updatePowerups(dt){
  for(let i=powerups.length-1;i>=0;i--){
    const u = powerups[i];
    u.t += dt;
    u.bob += dt*2.2;
    u.y += u.speed*dt;
    u.x += Math.sin(u.bob)*W*0.06*dt*3;
    const catchR = (u.type === 'nova' ? u.size*1.2 + ship.w*0.34 : u.size*0.62 + ship.w*0.48);
    const dx=u.x-ship.x, dy=u.y-ship.y;
    if(dx*dx+dy*dy < catchR*catchR){
      if(u.type === 'nova'){
        stopNovaSirene(u);
        sfxAufsammeln('nova');
        powerups.splice(i,1);
        detonateAll();
      } else {
        sfxAufsammeln('shield');
        shield = 2.0;                  // 2 Sekunden Schutzschirm
        score += 5; updateHUD();
        powerups.splice(i,1);
      }
      continue;
    }
    if(u.y - u.size > H){ stopNovaSirene(u); powerups.splice(i,1); }
  }
}
function drawPowerup(u){
  if(u.type === 'nova'){ drawNova(u); return; }
  const s = u.size;
  ctx.save();
  ctx.translate(u.x, u.y + Math.sin(u.bob)*s*0.06);

  // auffälliges Glühen, damit man es nicht übersieht
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.25*Math.abs(Math.sin(u.t*4));
  const halo = ctx.createRadialGradient(0,0,s*0.3, 0,0,s*0.95);
  halo.addColorStop(0,'rgba(120,220,255,.75)');
  halo.addColorStop(1,'rgba(120,220,255,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0,0,s*0.95,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Motor (kleiner Comic-Antrieb)
  ctx.save();
  ctx.rotate(Math.sin(u.t*2)*0.12);
  const body = ctx.createLinearGradient(0,-s*0.26,0,s*0.22);
  body.addColorStop(0,'#BFEAFF'); body.addColorStop(1,'#4A8FD8');
  ctx.fillStyle = body;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-s*0.20, -s*0.26, s*0.40, s*0.44, s*0.10);
  else ctx.rect(-s*0.20,-s*0.26,s*0.40,s*0.44);
  ctx.fill();
  // Kühlrippen
  ctx.strokeStyle = 'rgba(20,40,70,.35)'; ctx.lineWidth = s*0.03;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(-s*0.16, -s*0.14 + i*s*0.12);
    ctx.lineTo( s*0.16, -s*0.14 + i*s*0.12);
    ctx.stroke();
  }
  // Düse
  ctx.fillStyle = '#33507A';
  ctx.beginPath();
  ctx.moveTo(-s*0.16, s*0.18); ctx.lineTo(s*0.16, s*0.18);
  ctx.lineTo(s*0.10, s*0.30);  ctx.lineTo(-s*0.10, s*0.30);
  ctx.closePath(); ctx.fill();
  // Flämmchen
  ctx.globalAlpha = 0.75 + 0.25*Math.sin(u.t*18);
  const fl = ctx.createLinearGradient(0,s*0.28,0,s*0.46);
  fl.addColorStop(0,'#FFD23F'); fl.addColorStop(1,'rgba(79,227,193,0)');
  ctx.fillStyle = fl;
  ctx.beginPath(); ctx.moveTo(-s*0.08,s*0.29); ctx.lineTo(0,s*0.48); ctx.lineTo(s*0.08,s*0.29); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // Seifenblase drumherum
  const bub = ctx.createRadialGradient(-s*0.16,-s*0.18,s*0.04, 0,0,s*0.56);
  bub.addColorStop(0,'rgba(255,255,255,.55)');
  bub.addColorStop(0.55,'rgba(140,220,255,.14)');
  bub.addColorStop(1,'rgba(79,227,193,.30)');
  ctx.fillStyle = bub;
  ctx.beginPath(); ctx.arc(0,0,s*0.56,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,245,255,.85)'; ctx.lineWidth = s*0.035;
  ctx.beginPath(); ctx.arc(0,0,s*0.56,0,Math.PI*2); ctx.stroke();
  // Glanzpunkt
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(-s*0.22,-s*0.24, s*0.09, s*0.05, -0.6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawShield(){
  const r = shieldR();
  const pulse = 0.6 + 0.4*Math.abs(Math.sin(shield*9));
  ctx.save();
  ctx.translate(ship.x, ship.y);

  // äußeres Glühen, auch unter dem Finger gut erkennbar
  ctx.globalAlpha = pulse*0.55;
  const halo = ctx.createRadialGradient(0,0,r*0.7, 0,0,r*1.28);
  halo.addColorStop(0,'rgba(90,190,255,.55)');
  halo.addColorStop(1,'rgba(90,190,255,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0,0,r*1.28,0,Math.PI*2); ctx.fill();

  // Blasenfüllung
  ctx.globalAlpha = pulse;
  const g = ctx.createRadialGradient(0,0,r*0.5, 0,0,r);
  g.addColorStop(0,'rgba(90,180,255,.05)');
  g.addColorStop(0.72,'rgba(90,190,255,.26)');
  g.addColorStop(1,'rgba(140,230,255,.62)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

  // kräftiger Rand
  ctx.strokeStyle = 'rgba(160,235,255,.98)';
  ctx.lineWidth = Math.max(3, ship.w*0.055);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();

  // Glanzpunkt
  ctx.globalAlpha = pulse*0.9;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.ellipse(-r*0.42,-r*0.44, r*0.16, r*0.09, -0.6, 0, Math.PI*2); ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawNova(u){
  drawKugel(u.x, u.y + Math.sin(u.bob)*u.size*0.10, u.size, 'orange', u.t, true);
}

/* ---------- Explosion (Staubwolke) ---------- */
function explode(x, y, wucht = 1, stumm = false){
  if(!stumm) sfxExplosion(wucht);
  const cols = ['#EAE3D2','#CFC4A8','#B9AE92','#F2EBDA','#9C927B'];
  for(let i=0;i<20;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 30 + Math.random()*130;
    particles.push({
      x, y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 20,
      r: ship.w*0.10 + Math.random()*ship.w*0.14,
      grow: 1 + Math.random()*1.4,
      life:0, max:0.55 + Math.random()*0.5,
      col: cols[(Math.random()*cols.length)|0]
    });
  }
}

/* ---------- Level-Fluss ---------- */
function startGame(){
  try{ initSfx(); }catch(_){}          // Ton durch die Nutzeraktion freischalten
  level = 1; score = 0; lives = 3; lifeMilestone = 0;
  updateLives();
  startLevel();
}
function startLevel(){
  stopAllLoops();
  musicStart();
  ensurePlanet();          // Kugel vorab berechnen, nicht im ersten Spielframe
  spokenAt = -1;
  timeLeft = LEVEL_TIME;
  meteors = []; particles = []; spawnTimer = 0; lastSpawnX = -999; invuln = 0;
  bullets = []; powerups = []; shield = 0;
  buildEnemySchedule();
  buildCannonSchedule();
  powerupDone = false;
  novaDone = false;
  flash = 0;
  // Schutzschirm: normal 1x, im Abschlusslevel (gemischt) 2x
  // früh genug, damit die Blase das Schiff vor Levelende erreicht (Fallzeit ~4s)
  const fenster = Math.max(1, LEVEL_TIME - 6.5);
  if(isMixed(level)){
    schildPlan = [
      1.5 + Math.random()*(fenster*0.42),
      1.5 + fenster*0.5 + Math.random()*(fenster*0.42)
    ];
  } else {
    schildPlan = [ 1.5 + Math.random()*fenster ];
  }
  schildIdx = 0;
  novaSchedule = 1.5 + Math.random()*fenster;
  ship.alive = true; ship.x = W/2; ship.y = ship.yMax; ship.prevX = W/2; ship.tilt = 0;
  hideOverlay();
  state = S.PLAY;
  updateLives();
  updateHUD();
}
function respawn(){
  for(const e of enemies) stopSturzflug(e);
  for(const c of cannons) stopSirren(c);
  meteors = []; enemies = []; particles = []; bullets = []; cannons = []; shield = 0;
  for(const u of powerups) if(u.type === 'nova' && !u._snd) startNovaSirene(u);
  ship.alive = true;
  ship.x = W/2; ship.y = ship.yMax; ship.prevX = W/2; ship.tilt = 0;
  spawnTimer = 0.6;   // kurze Verschnaufpause
  invuln = 1.5;       // kurz unverwundbar (Schiff blinkt)
  state = S.PLAY;
}
function nextLevel(){
  if(level % 10 === 0 && lives < 5){       // Bonusleben nach jedem gemischten Level
    lives++;
    updateLives();
    sfxExtraleben();
  }
  level++;
  startLevel();
}

function die(){
  if(state === S.DYING || state === S.OVER) return;
  lives--;
  updateLives();
  state = S.DYING;
  ship.alive = false;
  deathTimer = 0;
  stopAllLoops();
  if(lives <= 0) musicStop(); else musicDuck(1.6, 0.18);
  explode(ship.x, ship.y, 1.6);      // eigener Untergang klingt wuchtiger
  sfxSchade();                       // ...und wird betrauert
  highscore = Math.max(highscore, score);
}

/* ---------- Update ---------- */
function update(dt){
  planetT += dt;
  // Sterne animieren immer
  for(const s of stars){ s.tw += dt*s.sp; s.y += dt*s.drift; if(s.y>H){s.y=0;s.x=Math.random()*W;} }

  if(state === S.PLAY){
    if(invuln > 0) invuln -= dt;
    updateParticles(dt);
    checkBonusLeben();          // alle 500 Punkte ein Extraleben
    // Countdown
    timeLeft -= dt;

    // Letzte zwei Sekunden: Ton bei 2, Ton bei 1, Freigabeton bei 0
    const rest = Math.ceil(timeLeft);
    if(rest <= 2 && rest >= 1 && rest !== spokenAt){
      spokenAt = rest;
      sfxStartTon(false);
    }

    if(timeLeft <= 0){
      timeLeft = 0; updateHUD();
      sfxStartTon(true);            // Freigabeton -> Level geschafft
      stopAllLoops();
      musicStop();
      state = S.LEVELUP;
      showLevelUp();
      return;
    }

    // Meteoriten erzeugen
    const d = difficulty();
    spawnTimer -= dt;
    if(spawnTimer <= 0){ spawnMeteor(); spawnTimer = d.spawnInterval; }

    // Schiffsneigung aus Bewegung
    const vx = ship.x - ship.prevX;
    ship.tilt += (Math.max(-1,Math.min(1,vx/18)) * 0.35 - ship.tilt) * Math.min(1, dt*12);
    ship.prevX = ship.x;

    // Kamikaze-Gegner nach Zeitplan
    const elapsed = LEVEL_TIME - timeLeft;
    while(enemyIdx < enemySchedule.length && elapsed >= enemySchedule[enemyIdx]){
      spawnEnemy(); enemyIdx++;
    }
    updateEnemies(dt);
    if(state !== S.PLAY) return;   // Gegner hat getroffen

    // Rand-Kanonen (ab Level 3, 2x pro Runde)
    while(cannonIdx < cannonSchedule.length && elapsed >= cannonSchedule[cannonIdx]){
      spawnCannon(); cannonIdx++;
    }
    updateCannons(dt);
    updateBullets(dt);
    if(state !== S.PLAY) return;   // Geschoss hat getroffen

    // Power-ups
    while(schildIdx < schildPlan.length && elapsed >= schildPlan[schildIdx]){
      spawnPowerup('shield'); schildIdx++;
    }
    if(!novaDone && elapsed >= novaSchedule){ spawnPowerup('nova'); novaDone = true; }
    updatePowerups(dt);
    if(shield > 0) shield -= dt;
    if(flash > 0)  flash  -= dt;

    // Meteoriten bewegen + Kollision
    for(let i=meteors.length-1;i>=0;i--){
      const m = meteors[i];
      m.y += m.speed*dt;
      m.rot += m.rotSpeed*dt;
      // Kollision (Kreis)
      if(invuln <= 0){
        const dx = m.x - ship.x, dy = m.y - ship.y;
        if(shield > 0){
          const rs = m.hit + shieldR();
          if(dx*dx+dy*dy < rs*rs){ explode(m.x,m.y); meteors.splice(i,1); score++; updateHUD(); continue; }
        } else {
          const rr = m.hit + ship.w*0.34;
          if(dx*dx+dy*dy < rr*rr){ die(); return; }
        }
      }
      // unten raus -> Punkt
      if(m.y - m.size > H){ meteors.splice(i,1); score++; updateHUD(); }
    }
  }
  else if(state === S.DYING){
    deathTimer += dt;
    updateParticles(dt);
    if(deathTimer > 0.9){
      if(lives > 0) respawn();
      else { state = S.OVER; showGameOver(); }
    }
  }
  else {
    updateParticles(dt);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - dt*2.2); p.vy *= (1 - dt*2.2);
    p.r += p.grow*dt*40;
    if(p.life > p.max) particles.splice(i,1);
  }
}

/* ---------- Render ---------- */
/* Klassische Invader-Silhouette, damit die Farbe frei wählbar ist
   (Emoji lassen sich nicht einfärben) */
const INVADER = [
  '..X.....X..',
  '...X...X...',
  '..XXXXXXX..',
  '.XX.XXX.XX.',
  'XXXXXXXXXXX',
  'X.XXXXXXX.X',
  'X.X.....X.X',
  '...XX.XX...'
];
function drawInvader(s){
  const spalten = 11, zeilen = 8;
  const px = s / spalten;
  const x0 = -s/2, y0 = -(zeilen*px)/2;

  ctx.save();
  // Weicher Schein hinter der Figur (getrennt, damit die Form scharf bleibt)
  const schein = ctx.createRadialGradient(0,0,s*0.10, 0,0,s*0.62);
  schein.addColorStop(0, 'rgba(90,216,255,.42)');
  schein.addColorStop(1, 'rgba(90,216,255,0)');
  ctx.fillStyle = schein;
  ctx.beginPath(); ctx.arc(0,0,s*0.62,0,Math.PI*2); ctx.fill();

  // Figur selbst scharf zeichnen - kein Weichzeichner, sonst verschmieren die Lücken
  ctx.fillStyle = '#5AD8FF';                      // knalliges Hellblau
  for(let r=0;r<zeilen;r++){
    for(let c=0;c<spalten;c++){
      if(INVADER[r][c] === 'X') ctx.fillRect(x0 + c*px, y0 + r*px, px+0.5, px+0.5);
    }
  }

  // Oberseite heller -> plastischer
  ctx.fillStyle = 'rgba(198,244,255,.85)';
  for(let r=0;r<3;r++){
    for(let c=0;c<spalten;c++){
      if(INVADER[r][c] === 'X') ctx.fillRect(x0 + c*px, y0 + r*px, px+0.6, px*0.5);
    }
  }
  // Unterseite dunkler
  ctx.fillStyle = 'rgba(20,110,165,.38)';
  for(let r=zeilen-2;r<zeilen;r++){
    for(let c=0;c<spalten;c++){
      if(INVADER[r][c] === 'X') ctx.fillRect(x0 + c*px, y0 + r*px + px*0.5, px+0.6, px*0.5);
    }
  }
  // Augen
  ctx.fillStyle = '#0B2436';
  ctx.fillRect(x0 + 3*px, y0 + 4*px, px, px);
  ctx.fillRect(x0 + 7*px, y0 + 4*px, px, px);
  ctx.restore();
}

function render(){
  // Hintergrund
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141B4D'); g.addColorStop(0.55,'#2A1A5E'); g.addColorStop(1,'#0B1030');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Planet des aktuellen Zehnerblocks
  drawPlanet(planetT);

  // Sterne
  for(const s of stars){
    const a = 0.35 + Math.sin(s.tw)*0.35 + 0.3;
    ctx.globalAlpha = Math.max(0,Math.min(1,a));
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Meteoriten
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const m of meteors){
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    if(m.emoji === '👾'){
      drawInvader(m.size);                        // eigene Figur, hellblau
    } else {
      ctx.font = m.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(m.emoji, 0, 0);
    }
    ctx.restore();
  }

  // Geschosse der Kanonen (Leuchtkugeln)
  for(const b of bullets) drawKugel(b.x, b.y, b.size, b.farbe, b.t, false);

  // Power-up (Motor in der Blase)
  for(const u of powerups) drawPowerup(u);

  // Schiff
  if(ship.alive && (state===S.PLAY)) drawShip();
  if(ship.alive && state===S.PLAY && shield > 0) drawShield();

  // Kanonen am Rand
  for(const c of cannons) drawCannon(c);

  // Kamikaze-Gegner
  for(const e of enemies) drawEnemy(e);

  // Explosionspartikel
  for(const p of particles){
    const t = p.life/p.max;
    ctx.globalAlpha = (1-t)*0.85;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Blitz der Nova-Sprengung
  if(flash > 0){
    ctx.globalAlpha = Math.min(1, flash*2.2);
    ctx.fillStyle = 'rgba(255,170,70,.55)';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}

/* niedliches Comic-Raumschiff (Untertasse) */
function drawShip(){
  const w = ship.w, h = w*0.62;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.tilt*0.5);
  if(invuln > 0) ctx.globalAlpha = 0.35 + 0.65*Math.abs(Math.sin(invuln*18));

  // Schatten/Glühen
  ctx.save();
  ctx.globalAlpha=.35;
  const glow = ctx.createRadialGradient(0,h*0.1,2,0,h*0.1,w*0.75);
  glow.addColorStop(0,'rgba(79,227,193,.9)'); glow.addColorStop(1,'rgba(79,227,193,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,h*0.2,w*0.75,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Antriebsstrahl
  ctx.save();
  ctx.globalAlpha=.9;
  const flame = ctx.createLinearGradient(0,h*0.25,0,h*0.9);
  flame.addColorStop(0,'#FFD23F'); flame.addColorStop(1,'rgba(255,107,139,0)');
  ctx.fillStyle=flame;
  ctx.beginPath();
  ctx.moveTo(-w*0.14,h*0.28); ctx.lineTo(0,h*0.95); ctx.lineTo(w*0.14,h*0.28); ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Untertassen-Körper
  const body = ctx.createLinearGradient(0,-h*0.1,0,h*0.35);
  body.addColorStop(0,'#EAF0FF'); body.addColorStop(1,'#A9B8E0');
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.ellipse(0,h*0.12,w*0.5,h*0.28,0,0,Math.PI*2); ctx.fill();

  // Randlichter
  const lights=['#FFD23F','#4FE3C1','#FF6B8B','#4FE3C1','#FFD23F'];
  for(let i=0;i<5;i++){
    const ang = Math.PI + (i/4)*Math.PI;
    ctx.fillStyle=lights[i];
    ctx.beginPath();
    ctx.arc(Math.cos(ang)*w*0.36, h*0.12+Math.sin(ang)*h*0.20, w*0.035,0,Math.PI*2);
    ctx.fill();
  }

  // Glaskuppel
  const dome = ctx.createLinearGradient(0,-h*0.5,0,h*0.05);
  dome.addColorStop(0,'#DFF6FF'); dome.addColorStop(1,'#7FD8F0');
  ctx.fillStyle=dome;
  ctx.beginPath(); ctx.ellipse(0,-h*0.02,w*0.27,h*0.32,0,Math.PI,0); ctx.closePath(); ctx.fill();

  // süße Äuglein
  ctx.fillStyle='#1E2340';
  ctx.beginPath(); ctx.arc(-w*0.08,-h*0.06,w*0.045,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( w*0.08,-h*0.06,w*0.045,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-w*0.065,-h*0.085,w*0.017,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( w*0.095,-h*0.085,w*0.017,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

        + 'background:#7A1020;color:#FFE3E8;border:1px solid #FF6B8B;border-radius:12px;'
        + 'padding:10px 12px;font:600 12px/1.45 -apple-system,system-ui,sans-serif;'
        + 'white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent = 'Fehler: ' + text;
  }catch(_){}
}
window.addEventListener('error', e => {

});
