/* Zeitlimit: eine Ablage, die nicht antwortet, darf nichts blockieren */
function mitZeitlimit(versprechen, ms){
  return Promise.race([
    versprechen,
    new Promise((_, ab) => setTimeout(() => ab(new Error('Zeitüberschreitung')), ms))
  ]);
}

/* ---------- Speicherschicht ----------
   Es gibt bis zu drei Ablagen. Jede wird beim Start EINZELN geprüft, indem
   probeweise geschrieben und wieder gelesen wird. Genutzt werden alle, die
   diesen Test bestehen. Eine defekte Ablage darf die anderen nicht blockieren. */
const PROBE_KEY = 'sternenflug:probe';
let ABLAGEN = [];
let speicherGeprueft = false;

function ablageArtifact(){
  return {
    name: 'App-Speicher',
    async get(k){ const r = await window.storage.get(k); return (r && r.value != null) ? r.value : null; },
    async set(k, v){ await window.storage.set(k, v); },
    async del(k){ await window.storage.delete(k); }
  };
}
function ablageLocal(){
  return {
    name: 'Browserspeicher',
    async get(k){ return window.localStorage.getItem(k); },
    async set(k, v){ window.localStorage.setItem(k, v); },
    async del(k){ window.localStorage.removeItem(k); }
  };
}
function ablageIDB(){
  const oeffne = () => new Promise((res, rej) => {
    const rq = window.indexedDB.open('sternenflug', 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror  = () => rej(rq.error);
  });
  const tat = (modus, fn) => oeffne().then(db => new Promise((res, rej) => {
    const tx = db.transaction('kv', modus);
    const rq = fn(tx.objectStore('kv'));
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  }));
  return {
    name: 'Datenbank',
    async get(k){ const v = await tat('readonly',  s => s.get(k)); return v == null ? null : v; },
    async set(k, v){ await tat('readwrite', s => s.put(v, k)); },
    async del(k){ await tat('readwrite', s => s.delete(k)); }
  };
}

/* Jede Ablage durch Schreiben und Zurücklesen prüfen */
async function pruefeAblagen(){
  const kandidaten = [];
  try{ if(window.storage) kandidaten.push(ablageArtifact()); }catch(_){}
  try{ if(window.localStorage) kandidaten.push(ablageLocal()); }catch(_){}
  try{ if(window.indexedDB) kandidaten.push(ablageIDB()); }catch(_){}

  const gut = [];
  for(const a of kandidaten){
    try{
      await mitZeitlimit(a.set(PROBE_KEY, 'ok'), 1200);
      const zurueck = await mitZeitlimit(a.get(PROBE_KEY), 1200);
      if(zurueck === 'ok') gut.push(a);        // nur was nachweislich zurückkommt
      try{ await mitZeitlimit(a.del(PROBE_KEY), 800); }catch(_){}
    }catch(_){}                                 // hängende Ablage wird einfach übergangen
  }
  ABLAGEN = gut;
  speicherGeprueft = true;
  return gut.map(a => a.name);
}
function kannSpeichern(){ return ABLAGEN.length > 0; }

/* Wert in ALLE funktionierenden Ablagen schreiben */
async function speicherSet(key, wert){
  if(!speicherGeprueft) await pruefeAblagen();
  for(const a of ABLAGEN){ try{ await a.set(key, wert); }catch(_){} }
}
/* Ersten gefundenen Wert lesen */
async function speicherGet(key){
  if(!speicherGeprueft) await pruefeAblagen();
  for(const a of ABLAGEN){
    try{ const v = await a.get(key); if(v != null) return v; }catch(_){}
  }
  return null;
}
async function speicherDel(key){
  if(!speicherGeprueft) await pruefeAblagen();
  for(const a of ABLAGEN){ try{ await a.del(key); }catch(_){} }
}

function parseList(raw){
  try{
    const a = JSON.parse(raw);
    return Array.isArray(a) ? a.filter(e => e && typeof e.s === 'number' && typeof e.n === 'string') : [];
  }catch(_){ return []; }
}
function mergeScores(...lists){
  const seen = new Map();
  for(const list of lists){
    for(const e of list){
      const key = `${e.n}|${e.s}|${e.l}`;
      if(!seen.has(key)) seen.set(key, e);
    }
  }
  return [...seen.values()].sort((a,b)=> b.s - a.s).slice(0,10);
}

/* Aus ALLEN Ablagen lesen und zusammenführen - so überlebt der Stand,
   solange auch nur eine Ablage ihn noch hat. */
async function loadScores(){
  if(!speicherGeprueft) await pruefeAblagen();
  const listen = [];
  for(const a of ABLAGEN){
    try{
      const roh = await mitZeitlimit(a.get(HS_KEY), 1500);
      if(roh) listen.push(parseList(roh));
    }catch(_){}
  }
  // Auch den aktuellen Stand im Arbeitsspeicher mitnehmen: Das Laden läuft
  // nebenläufig und darf einen soeben eingetragenen Rekord nicht verwerfen.
  scores = mergeScores(...listen, scores);
  return scores;
}

async function saveScores(){
  // Eine leere Liste niemals über vorhandene Daten schreiben
  // (Löschen läuft ausschließlich über clearScores)
  if(scores.length === 0) return;
  await speicherSet(HS_KEY, JSON.stringify(scores));
}
async function clearScores(){
  scores = [];
  await speicherDel(HS_KEY);
}
function qualifies(sc){
  if(sc <= 0) return false;
  if(scores.length < 10) return true;
  return sc > scores[scores.length-1].s;
}
function addScore(name, sc, lv){
  scores.push({ n:name, s:sc, l:lv });
  scores.sort((a,b)=> b.s - a.s);
  scores = scores.slice(0,10);
  saveScores();
  dateiAktualisieren();            // verknüpfte Datei mitziehen
  return scores.findIndex(e => e.n===name && e.s===sc && e.l===lv);
}

/* ---------- Fanfare: königlicher Herolds-Stil (WebAudio, ohne Dateien) ---------- */
let actx = null, reverb = null, master = null;

function initAudio(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  if(master) return;

  master = actx.createGain();
  master.gain.value = 0.85;
  master.connect(actx.destination);

  // Saal-Hall: Impulsantwort synthetisch erzeugen (klingt nach großer Halle)
  const len = actx.sampleRate * 2.2;
  const imp = actx.createBuffer(2, len, actx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = imp.getChannelData(ch);
    for(let i=0;i<len;i++){
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
    }
  }
  reverb = actx.createConvolver();
  reverb.buffer = imp;
  const wet = actx.createGain();
  wet.gain.value = 0.45;
  reverb.connect(wet);
  wet.connect(master);
}

/* Trompeten-/Hornklang: verstimmte Sägezähne durch ein sich öffnendes Filter */
function brass(freq, at, dur, vol){
  const t = at;
  const g = actx.createGain();
  const f = actx.createBiquadFilter();
  f.type = 'lowpass';
  f.Q.value = 1.1;
  f.frequency.setValueAtTime(freq*1.4, t);
  f.frequency.linearRampToValueAtTime(freq*7, t + 0.06);   // heller Anblasmoment
  f.frequency.linearRampToValueAtTime(freq*3.2, t + dur);

  // drei leicht verstimmte Stimmen -> voller, orchestraler Körper
  for(const det of [-7, 0, 7]){
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, t);
    o.detune.setValueAtTime(det, t);
    o.connect(f);
    o.start(t); o.stop(t + dur + 0.08);
  }
  f.connect(g);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.045);      // Anblasen
  g.gain.setValueAtTime(vol, t + dur*0.72);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.06);

  g.connect(master);
  g.connect(reverb);
}

/* Pauke für den zeremoniellen Nachdruck */
function timpani(at, vol){
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, at);
  o.frequency.exponentialRampToValueAtTime(55, at + 0.16);
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
  o.connect(g); g.connect(master); g.connect(reverb);
  o.start(at); o.stop(at + 0.6);
}
function fanfare(){
  try{
    initAudio();
    const t = actx.currentTime + 0.05;

    // D-Dur (klassische Trompetentonart). Herolds-Motiv mit punktierten Rhythmen.
    const D4=293.66, Fs4=369.99, A4=440.00, D5=587.33, Fs5=739.99, A5=880.00, D6=1174.66;

    // Oberstimme (1. Trompete)
    const lead = [
      [D5,  0.00, 0.34],                                  // Ruf
      [D5,  0.38, 0.14], [A4, 0.53, 0.14],                // punktierte Antwort
      [D5,  0.70, 0.36],
      [Fs5, 1.10, 0.34],
      [A5,  1.48, 0.52],                                  // Höhepunkt, gehalten
      [A5,  2.06, 0.13], [Fs5, 2.20, 0.13],
      [A5,  2.34, 0.13], [D6,  2.48, 0.13],               // schneller Aufstieg
      [A5,  2.66, 0.30],                                  // Akzent
      [Fs5, 3.02, 0.15], [A5, 3.18, 0.15],
      [D6,  3.36, 1.35],                                  // Schlusston, lang
    ];
    for(const [f, at, dur] of lead) brass(f, t+at, dur, 0.16);

    // 2. Trompete: Terz/Quinte darunter -> königlicher Satz statt Einzelton
    const harm = [
      [Fs4, 0.00, 0.34], [Fs4, 0.38, 0.14], [D4, 0.53, 0.14], [Fs4, 0.70, 0.36],
      [A4,  1.10, 0.34], [D5, 1.48, 0.52],
      [D5,  2.66, 0.30], [Fs5, 3.36, 1.35],
    ];
    for(const [f, at, dur] of harm) brass(f, t+at, dur, 0.10);

    // Hörner: tragendes Fundament
    brass(D4,  t+0.00, 1.02, 0.09);
    brass(A4,  t+1.10, 0.72, 0.09);
    brass(D4,  t+2.66, 0.30, 0.10);
    brass(A4,  t+3.36, 1.35, 0.11);
    brass(D4,  t+3.36, 1.35, 0.12);

    // Pauken auf den zeremoniellen Schwerpunkten
    timpani(t+0.00, 0.55);
    timpani(t+1.48, 0.50);
    timpani(t+2.66, 0.45);
    timpani(t+3.36, 0.70);
  }catch(_){ /* Ton nicht verfügbar - Spiel läuft trotzdem */ }
}


/* ---------- Soundeffekte ---------- */
let sfxOn = true;
let sfxBus = null;

function initSfx(){
  initAudio();
  if(sfxBus) return;
  sfxBus = actx.createGain();
  sfxBus.gain.value = 1.0;
  sfxBus.connect(master);
}
function rauschen(dauer){                    // Rauschpuffer erzeugen
  const len = Math.max(1, Math.floor(actx.sampleRate * dauer));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}

/* Bedrohliches Sirren, während die Kanone zielt */
function startSirren(c, dauer){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime;
    const g = actx.createGain();
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 7;
    bp.frequency.setValueAtTime(520, t);
    bp.frequency.linearRampToValueAtTime(1150, t + dauer);   // wird schriller -> Bedrohung wächst

    // zwei leicht verstimmte Sägezähne -> unangenehmes Schweben
    const o1 = actx.createOscillator(), o2 = actx.createOscillator();
    o1.type = o2.type = 'sawtooth';
    o1.frequency.setValueAtTime(88, t);
    o2.frequency.setValueAtTime(93, t);
    o1.frequency.linearRampToValueAtTime(150, t + dauer);
    o2.frequency.linearRampToValueAtTime(157, t + dauer);

    // Tremolo-LFO -> das "Sirren"
    const lfo = actx.createOscillator(), lfoG = actx.createGain();
    lfo.type = 'sine'; lfo.frequency.setValueAtTime(7, t);
    lfo.frequency.linearRampToValueAtTime(14, t + dauer);
    lfoG.gain.value = 0.07;                                  // kräftigeres Schwingen
    lfo.connect(lfoG); lfoG.connect(g.gain);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.12);     // deutlich lauter
    g.gain.exponentialRampToValueAtTime(0.22, t + dauer);    // wächst bis zum Schuss

    o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(sfxBus);
    o1.start(t); o2.start(t); lfo.start(t);
    c._snd = { o1, o2, lfo, g };
  }catch(_){}
}
function stopSirren(c){
  const s = c && c._snd;
  if(!s) return;
  c._snd = null;
  try{
    const t = actx.currentTime;
    s.g.gain.cancelScheduledValues(t);
    s.g.gain.setValueAtTime(Math.max(0.0001, s.g.gain.value), t);
    s.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.o1.stop(t + 0.08); s.o2.stop(t + 0.08); s.lfo.stop(t + 0.08);
  }catch(_){}
}

/* Kanonenschuss: kurzer Knall mit Nachschlag */
function sfxKanone(){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime;
    // Knall
    const src = actx.createBufferSource();
    src.buffer = rauschen(0.22);
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2600, t);
    lp.frequency.exponentialRampToValueAtTime(320, t + 0.20);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.45, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    src.connect(lp); lp.connect(g); g.connect(sfxBus);
    src.start(t);
    // Rückstoß-Bums
    const o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.16);
    og.gain.setValueAtTime(0.35, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
    o.connect(og); og.connect(sfxBus);
    o.start(t); o.stop(t + 0.22);
  }catch(_){}
}

/* Nova: leise pulsierende Schiffssirene, solange sie fällt */
function startNovaSirene(u){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime;
    const g = actx.createGain();
    const o = actx.createOscillator();

    // langsames Auf und Ab -> Sirenen-Wehklagen

    wail.type = 'sine'; wail.frequency.value = 1.6;
    wailG.gain.value = 150;

    // Pulsieren der Lautstärke

    o.start(t); wail.start(t); puls.start(t);
    u._snd = { o, wail, puls, g };

    s.g.gain.cancelScheduledValues(t);

/* Verzerrerkennlinie für den kernigen Biss */
let shaperCurve = null;
function makeShaper(){
  if(!shaperCurve){
    const n = 1024;
    shaperCurve = new Float32Array(n);
    for(let i=0;i<n;i++){
      const x = (i/(n-1))*2 - 1;
      shaperCurve[i] = Math.tanh(x * 3.2);      // sanfte Sättigung
    }
  }
  const ws = actx.createWaveShaper();
  ws.curve = shaperCurve;
  ws.oversample = '2x';
  return ws;
}

/* Explosion: zweitonig als "ka-wumm" - gedrosselt, damit die Nova keine Lawine auslöst */
let lastBoom = 0, boomsInRow = 0;
function sfxExplosion(wucht = 1){
  if(!sfxOn) return;
  try{
    initSfx();
    const now = actx.currentTime;
    if(now - lastBoom < 0.05){ if(++boomsInRow > 3) return; }   // max. 4 gleichzeitig
    else boomsInRow = 0;
    lastBoom = now;

    const ws = makeShaper();
    ws.connect(sfxBus);

    const KA = now;             // 1. Schlag: heller, harter Anriss
    const WUMM = now + 0.13;    // 2. Schlag: tiefe Detonation, leicht versetzt

    /* --- "KA" : kurzer, scharfer Knall --- */
    const ka = actx.createBufferSource();
    ka.buffer = rauschen(0.18);
    const kaBp = actx.createBiquadFilter();
    kaBp.type = 'bandpass'; kaBp.Q.value = 0.9;
    kaBp.frequency.setValueAtTime(1100*wucht, KA);
    kaBp.frequency.exponentialRampToValueAtTime(450, KA + 0.16);
    const kaG = actx.createGain();
    kaG.gain.setValueAtTime(0.55*wucht, KA);
    kaG.gain.exponentialRampToValueAtTime(0.0001, KA + 0.17);
    ka.connect(kaBp); kaBp.connect(kaG); kaG.connect(ws);
    ka.start(KA);

    // heller Anriss-Ton
    const kaO = actx.createOscillator(), kaOG = actx.createGain();
    kaO.type = 'square';
    kaO.frequency.setValueAtTime(210*wucht, KA);
    kaO.frequency.exponentialRampToValueAtTime(75, KA + 0.10);
    kaOG.gain.setValueAtTime(0.22*wucht, KA);
    kaOG.gain.exponentialRampToValueAtTime(0.0001, KA + 0.12);
    kaO.connect(kaOG); kaOG.connect(ws);
    kaO.start(KA); kaO.stop(KA + 0.14);

    /* --- "WUMM" : tiefe, lange Detonation --- */
    const wu = actx.createBufferSource();
    wu.buffer = rauschen(2.8);
    const wuLp = actx.createBiquadFilter();
    wuLp.type = 'lowpass';
    wuLp.frequency.setValueAtTime(550*wucht, WUMM);
    wuLp.frequency.exponentialRampToValueAtTime(27.5, WUMM + 2.60);   // sackt tief ab
    const wuG = actx.createGain();
    wuG.gain.setValueAtTime(0.0001, WUMM);
    wuG.gain.exponentialRampToValueAtTime(0.55*wucht, WUMM + 0.05);  // Einschlag
    wuG.gain.exponentialRampToValueAtTime(0.16*wucht, WUMM + 0.60);
    wuG.gain.exponentialRampToValueAtTime(0.0001, WUMM + 2.70);      // langes Ausklingen
    wu.connect(wuLp); wuLp.connect(wuG); wuG.connect(ws);
    wu.start(WUMM);

    // tiefe Druckwelle - geht bis in den Subbass
    const o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(75*wucht, WUMM);
    o.frequency.exponentialRampToValueAtTime(9, WUMM + 1.90);
    og.gain.setValueAtTime(0.55*wucht, WUMM);
    og.gain.exponentialRampToValueAtTime(0.14*wucht, WUMM + 0.9);
    og.gain.exponentialRampToValueAtTime(0.0001, WUMM + 2.10);
    o.connect(og); og.connect(ws);
    o.start(WUMM); o.stop(WUMM + 2.15);

    // zusätzlicher Subbass-Körper für den Bauch
    const sub = actx.createOscillator(), subG = actx.createGain();
    sub.type = 'triangle';
    sub.frequency.setValueAtTime(36*wucht, WUMM);
    sub.frequency.exponentialRampToValueAtTime(11, WUMM + 1.60);
    subG.gain.setValueAtTime(0.0001, WUMM);
    subG.gain.exponentialRampToValueAtTime(0.34*wucht, WUMM + 0.07);
    subG.gain.exponentialRampToValueAtTime(0.0001, WUMM + 1.90);
    sub.connect(subG); subG.connect(sfxBus);
    sub.start(WUMM); sub.stop(WUMM + 1.95);

    /* --- Trümmer im Ausklang --- */
    const deb = actx.createBufferSource();
    deb.buffer = rauschen(1.8);
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 750;
    const dg = actx.createGain();
    dg.gain.setValueAtTime(0.0001, WUMM);
    dg.gain.exponentialRampToValueAtTime(0.11*wucht, WUMM + 0.08);
    dg.gain.exponentialRampToValueAtTime(0.0001, WUMM + 1.70);
    deb.connect(hp); hp.connect(dg); dg.connect(sfxBus);
    deb.start(WUMM);
  }catch(_){}
}

/* Nova-Detonation: schwerer Kanonenschlag - lauter und tiefer als alles andere */
function sfxNovaKnall(){
  if(!sfxOn) return;
  try{
    initSfx();
    musicDuck(1.4, 0.22);
    const t = actx.currentTime;
    const ws = makeShaper();
    ws.connect(sfxBus);

    const KA   = t;
    const WUMM = t + 0.30;          // deutlich hörbare Lücke -> zwei klare Schläge

    /* ================= "KA" - kurzer, harter Anschlag ================= */
    const ka = actx.createBufferSource();
    ka.buffer = rauschen(0.22);
    const kaBp = actx.createBiquadFilter();
    kaBp.type = 'bandpass'; kaBp.Q.value = 1.0;
    kaBp.frequency.setValueAtTime(900, KA);
    kaBp.frequency.exponentialRampToValueAtTime(380, KA + 0.20);
    const kaG = actx.createGain();
    kaG.gain.setValueAtTime(0.50, KA);              // bewusst kleiner als das WUMM
    kaG.gain.exponentialRampToValueAtTime(0.0001, KA + 0.22);
    ka.connect(kaBp); kaBp.connect(kaG); kaG.connect(ws);
    ka.start(KA);

    const kaO = actx.createOscillator(), kaOG = actx.createGain();
    kaO.type = 'square';
    kaO.frequency.setValueAtTime(190, KA);
    kaO.frequency.exponentialRampToValueAtTime(70, KA + 0.14);
    kaOG.gain.setValueAtTime(0.30, KA);
    kaOG.gain.exponentialRampToValueAtTime(0.0001, KA + 0.18);
    kaO.connect(kaOG); kaOG.connect(ws);
    kaO.start(KA); kaO.stop(KA + 0.20);
    // ...KA klingt komplett aus, bevor das WUMM kommt

    /* ============ "WUMM" - schwerer, lauter, sehr langer Schlag ============ */
    const wu = actx.createBufferSource();
    wu.buffer = rauschen(4.2);
    const wuLp = actx.createBiquadFilter();
    wuLp.type = 'lowpass';
    wuLp.frequency.setValueAtTime(420, WUMM);
    wuLp.frequency.exponentialRampToValueAtTime(30, WUMM + 4.00);
    const wuG = actx.createGain();
    wuG.gain.setValueAtTime(0.0001, WUMM);
    wuG.gain.exponentialRampToValueAtTime(1.30, WUMM + 0.05);   // viel lauter als das KA
    wuG.gain.exponentialRampToValueAtTime(0.40, WUMM + 1.00);
    wuG.gain.exponentialRampToValueAtTime(0.0001, WUMM + 4.10); // sehr langer Ausklang
    wu.connect(wuLp); wuLp.connect(wuG); wuG.connect(ws);
    wu.start(WUMM);

    // Mörser-Druckwelle
    const o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(52, WUMM);
    o.frequency.exponentialRampToValueAtTime(12, WUMM + 3.00);
    og.gain.setValueAtTime(1.10, WUMM);
    og.gain.exponentialRampToValueAtTime(0.30, WUMM + 1.30);
    og.gain.exponentialRampToValueAtTime(0.0001, WUMM + 3.20);
    o.connect(og); og.connect(ws);
    o.start(WUMM); o.stop(WUMM + 3.25);

    // Subbass-Bauch
    const sub = actx.createOscillator(), sg = actx.createGain();
    sub.type = 'triangle';
    sub.frequency.setValueAtTime(28, WUMM);
    sub.frequency.exponentialRampToValueAtTime(8, WUMM + 2.60);
    sg.gain.setValueAtTime(0.0001, WUMM);
    sg.gain.exponentialRampToValueAtTime(0.80, WUMM + 0.07);
    sg.gain.exponentialRampToValueAtTime(0.0001, WUMM + 2.90);
    sub.connect(sg); sg.connect(sfxBus);
    sub.start(WUMM); sub.stop(WUMM + 2.95);

    // Trümmerregen im langen Ausklang
    const deb = actx.createBufferSource();
    deb.buffer = rauschen(2.6);
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 600;
    const dbg = actx.createGain();
    dbg.gain.setValueAtTime(0.0001, WUMM + 0.10);
    dbg.gain.exponentialRampToValueAtTime(0.26, WUMM + 0.22);
    dbg.gain.exponentialRampToValueAtTime(0.0001, WUMM + 2.50);
    deb.connect(hp); hp.connect(dbg); dbg.connect(sfxBus);
    deb.start(WUMM + 0.10);
  }catch(_){}
}

/* "Schade"-Ton: absteigendes Wehklagen beim eigenen Untergang */
function sfxSchade(){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime + 0.30;   // setzt ein, wenn der Knall schon rollt
    const dauer = 1.30;

    const g = actx.createGain();
    const o = actx.createOscillator();
    o.type = 'square';

    // taumelnd absteigend - in Stufen, nicht glatt
    o.frequency.setValueAtTime(760, t);
    const stufen = [640, 700, 520, 570, 410, 450, 310, 340, 230, 250, 165, 120];
    stufen.forEach((f, i) => {
      o.frequency.exponentialRampToValueAtTime(f, t + (i+1) * (dauer/stufen.length));
    });

    // Vibrato -> das Wimmern
    const vib = actx.createOscillator(), vibG = actx.createGain();
    vib.type = 'sine'; vib.frequency.setValueAtTime(11, t);
    vib.frequency.linearRampToValueAtTime(24, t + dauer);
    vibG.gain.setValueAtTime(18, t);
    vibG.gain.linearRampToValueAtTime(42, t + dauer);
    vib.connect(vibG); vibG.connect(o.frequency);

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t);
    lp.frequency.exponentialRampToValueAtTime(500, t + dauer);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
    g.gain.setValueAtTime(0.16, t + dauer*0.72);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);

    o.connect(lp); lp.connect(g); g.connect(sfxBus); g.connect(reverb);
    o.start(t); o.stop(t + dauer + 0.06);
    vib.start(t); vib.stop(t + dauer + 0.06);

    // resignierter Schlusston
    const end = t + dauer + 0.04;
    const eo = actx.createOscillator(), eg = actx.createGain();
    eo.type = 'triangle';
    eo.frequency.setValueAtTime(140, end);
    eo.frequency.exponentialRampToValueAtTime(85, end + 0.30);
    eg.gain.setValueAtTime(0.0001, end);
    eg.gain.exponentialRampToValueAtTime(0.14, end + 0.03);
    eg.gain.exponentialRampToValueAtTime(0.0001, end + 0.36);
    eo.connect(eg); eg.connect(sfxBus); eg.connect(reverb);
    eo.start(end); eo.stop(end + 0.4);
  }catch(_){}
}

/* Countdown wie am Startlicht: zwei kurze Töne, dann der Freigabeton */
let spokenAt = -1;

function sfxStartTon(final){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime;
    // zwei kurze Vorbereitungstöne, dann ein höherer, längerer Freigabeton
    const freq  = final ? 880 : 440;          // A5 statt A4 -> Oktave höher
    const dauer = final ? 0.85 : 0.22;
    const vol   = final ? 0.11 : 0.075;       // bewusst zurückhaltend

    // Grundton plus Oberton -> durchdringend wie ein Startsignal
    for(const [f, v] of [[freq, vol], [freq*2, vol*0.35], [freq*3, vol*0.12]]){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.012);
      g.gain.setValueAtTime(v, t + dauer*0.75);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      o.connect(g); g.connect(sfxBus); g.connect(reverb);
      o.start(t); o.stop(t + dauer + 0.05);
    }
  }catch(_){}
}

/* Angriffs-UFO: hohes, bedrohlich ansteigendes Heulen im Sturzflug */
function startSturzflug(e){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime;
    const dauer = 2.4;                       // deckt den Sturz gut ab
    const g = actx.createGain();

    // zwei Stimmen, leicht auseinanderlaufend -> unangenehmer Sog
    const o1 = actx.createOscillator(), o2 = actx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.setValueAtTime(430, t);
    o2.frequency.setValueAtTime(437, t);
    o1.frequency.exponentialRampToValueAtTime(1750, t + dauer);   // steigt an
    o2.frequency.exponentialRampToValueAtTime(1810, t + dauer);

    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 4.5;
    bp.frequency.setValueAtTime(700, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + dauer);

    // leichtes Flattern
    const lfo = actx.createOscillator(), lfoG = actx.createGain();
    lfo.type = 'sine'; lfo.frequency.setValueAtTime(9, t);
    lfo.frequency.linearRampToValueAtTime(22, t + dauer);
    lfoG.gain.value = 0.018;
    lfo.connect(lfoG); lfoG.connect(g.gain);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.085, t + dauer*0.8);    // wird lauter/näher

    o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(sfxBus);
    o1.start(t); o2.start(t); lfo.start(t);
    e._snd = { o1, o2, lfo, g };
  }catch(_){}
}
function stopSturzflug(e){
  const s = e && e._snd;
  if(!s) return;
  e._snd = null;
  try{
    const t = actx.currentTime;
    s.g.gain.cancelScheduledValues(t);
    s.g.gain.setValueAtTime(Math.max(0.0001, s.g.gain.value), t);
    s.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    s.o1.stop(t + 0.09); s.o2.stop(t + 0.09); s.lfo.stop(t + 0.09);
  }catch(_){}
}

/* Freundlicher Quittungston beim Einsammeln */
function sfxAufsammeln(art){
  if(!sfxOn) return;
  try{
    initSfx();
    const t = actx.currentTime;
    // Schutzschirm: warmes, aufsteigendes Zwei-Ton-Signal
    // Nova: strahlender Dreiklang obendrauf
    const noten = art === 'nova'
      ? [[659.25,0.00,0.10],[987.77,0.09,0.10],[1318.5,0.18,0.28]]   // E5 - H5 - E6
      : [[587.33,0.00,0.11],[880.00,0.10,0.26]];                     // D5 - A5
    for(const [f, at, dur] of noten){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t+at);
      g.gain.setValueAtTime(0.0001, t+at);
      g.gain.exponentialRampToValueAtTime(0.16, t+at+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t+at+dur);
      o.connect(g); g.connect(sfxBus); g.connect(reverb);   // etwas Glanz
      o.start(t+at); o.stop(t+at+dur+0.05);
    }
  }catch(_){}
}

/* Extraleben-Jingle: aufsteigender Jubel mit gehaltenem Schlussakkord */
function sfxExtraleben(){
  if(!sfxOn) return;
  try{
    initSfx();
    musicDuck(2.2, 0.20);
    const t = actx.currentTime + 0.02;
    const C5=523.25, E5=659.25, G5=783.99, C6=1046.5, E6=1318.5, G6=1568.0;

    // aufsteigende Melodie
    const mel = [
      [C5, 0.00, 0.14],
      [E5, 0.12, 0.14],
      [G5, 0.24, 0.14],
      [C6, 0.36, 0.18],
      [E6, 0.52, 0.18],
      [G6, 0.68, 0.24],
    ];
    for(const [f, at, dur] of mel){
      for(const [typ, v] of [['triangle', 0.30], ['square', 0.10]]){   // voller Klang
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = typ;
        o.frequency.setValueAtTime(f, t+at);
        g.gain.setValueAtTime(0.0001, t+at);
        g.gain.exponentialRampToValueAtTime(v, t+at+0.012);
        g.gain.setValueAtTime(v, t+at+dur*0.7);
        g.gain.exponentialRampToValueAtTime(0.0001, t+at+dur);
        o.connect(g); g.connect(sfxBus); g.connect(reverb);
        o.start(t+at); o.stop(t+at+dur+0.05);
      }
    }

    // gehaltener Schlussakkord - der eigentliche Jubel
    const ende = 0.94;
    for(const [f, v] of [[C6, 0.30], [E6, 0.22], [G6, 0.18], [C5, 0.20]]){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t+ende);
      g.gain.setValueAtTime(0.0001, t+ende);
      g.gain.exponentialRampToValueAtTime(v, t+ende+0.02);
      g.gain.setValueAtTime(v, t+ende+0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, t+ende+1.05);     // klingt lange aus
      o.connect(g); g.connect(sfxBus); g.connect(reverb);
      o.start(t+ende); o.stop(t+ende+1.1);
    }

    // funkelnder Glanz obendrauf
    for(let i=0;i<5;i++){
      const at = ende + 0.06 + i*0.09;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1568 + i*310, t+at);
      g.gain.setValueAtTime(0.0001, t+at);
      g.gain.exponentialRampToValueAtTime(0.10, t+at+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+at+0.22);
      o.connect(g); g.connect(sfxBus); g.connect(reverb);
      o.start(t+at); o.stop(t+at+0.26);
    }
  }catch(_){}
}

/* Alle 500 Punkte gibt es ein Extraleben */
function checkBonusLeben(){
  while(score >= (lifeMilestone + 1) * 500){
    lifeMilestone++;
    if(lives < 5){
      lives++;
      updateLives();
      sfxExtraleben();
    }
  }
}

/* Synth-Stimme mit Filterhüllkurve */
function synth(freq, at, dauer, typ, vol, filterAb, filterBis, q){
  const o = actx.createOscillator();
  const g = actx.createGain();
  const f = actx.createBiquadFilter();
  f.type = 'lowpass'; f.Q.value = q || 4;
  f.frequency.setValueAtTime(filterAb, at);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, filterBis), at + dauer*0.9);
  o.type = typ;
  o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
  g.gain.exponentialRampToValueAtTime(vol*0.6, at + dauer*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dauer);
  o.connect(f); f.connect(g); g.connect(musicBus);
  o.start(at); o.stop(at + dauer + 0.04);
}
/* Streicherfläche */
function flaeche(freq, at, dauer, vol){
  for(const det of [-6, 6]){
    const o = actx.createOscillator();
    const g = actx.createGain();
    const f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1900; f.Q.value = 0.8;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, at);
    o.detune.setValueAtTime(det, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.25);
    g.gain.setValueAtTime(vol, at + dauer*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dauer);
    o.connect(f); f.connect(g); g.connect(musicBus);
    o.start(at); o.stop(at + dauer + 0.05);
  }
}
/* Schlagzeug */
function kick(at){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, at);
  o.frequency.exponentialRampToValueAtTime(42, at + 0.09);
  g.gain.setValueAtTime(0.55, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
  o.connect(g); g.connect(musicBus);
  o.start(at); o.stop(at + 0.24);
}
function hihat(at, offen){
  const dauer = offen ? 0.16 : 0.045;
  const src = actx.createBufferSource();
  src.buffer = rauschen(dauer + 0.02);
  const hp = actx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 7500;
  const g = actx.createGain();
  g.gain.setValueAtTime(offen ? 0.10 : 0.07, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dauer);
  src.connect(hp); hp.connect(g); g.connect(musicBus);
  src.start(at);
}
function clap(at){
  const src = actx.createBufferSource();
  src.buffer = rauschen(0.15);
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.4;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.22, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
  src.connect(bp); bp.connect(g); g.connect(musicBus);
  src.start(at);
}

/* Zitternde Streicher (Tremolo) - der Angstklang schlechthin.
   Das Zittern kommt aus einem Modulator, nicht aus vielen Einzeltönen. */
function tremolo(freq, at, dauer, vol){
  for(const det of [-7, 7]){
    const o = actx.createOscillator();
    const g = actx.createGain();       // Hüllkurve
    const m = actx.createGain();       // wird vom Modulator bewegt
    const f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2200; f.Q.value = 0.9;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, at);
    o.detune.setValueAtTime(det, at);

    // Modulator: 15 Hz Zittern
    const lfo = actx.createOscillator();
    const lfoG = actx.createGain();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(15, at);
    lfoG.gain.setValueAtTime(0.55, at);
    m.gain.setValueAtTime(0.45, at);
    lfo.connect(lfoG); lfoG.connect(m.gain);

    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.18);
    g.gain.setValueAtTime(vol, at + dauer*0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dauer);

    o.connect(f); f.connect(m); m.connect(g); g.connect(musicBus);
    o.start(at); o.stop(at + dauer + 0.05);
    lfo.start(at); lfo.stop(at + dauer + 0.05);
  }
}
/* Tiefer Blechstoß - drohend, wie ein anrückender Verband */
function blechStoss(freq, at, dauer, vol){
  for(const [det, typ] of [[-9,'sawtooth'], [9,'sawtooth'], [0,'square']]){
    const o = actx.createOscillator(), g = actx.createGain();
    const f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(400, at);
    f.frequency.exponentialRampToValueAtTime(1500, at + 0.09);
    f.frequency.exponentialRampToValueAtTime(320, at + dauer);
    o.type = typ;
    o.frequency.setValueAtTime(freq, at);
    o.detune.setValueAtTime(det, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.035);
    g.gain.setValueAtTime(vol*0.8, at + dauer*0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dauer);
    o.connect(f); f.connect(g); g.connect(musicBus);
    o.start(at); o.stop(at + dauer + 0.04);
  }
}
/* Pauke - Marschcharakter */
function pauke(at, freq, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq*2.2, at);
  o.frequency.exponentialRampToValueAtTime(freq, at + 0.08);
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
  o.connect(g); g.connect(musicBus);
  o.start(at); o.stop(at + 0.6);
  const n = actx.createBufferSource();
  n.buffer = rauschen(0.09);
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(vol*0.5, at);
  ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
  n.connect(lp); lp.connect(ng); ng.connect(musicBus);
  n.start(at);
}

/* Einen Sechzehntel-Schritt planen */
function musicStepPlan(schritt, zeit){
  if(musicGefahr){ musicStepGefahr(schritt, zeit); return; }
  const takt   = Math.floor(schritt/16) % 4;      // welcher Akkord
  const inTakt = schritt % 16;
  const ak = AKKORDE[takt];

  // Schlagzeug: Viertel-Kick, Klatschen auf 2 und 4, Hihat auf Achteln
  if(inTakt % 4 === 0) kick(zeit);
  if(inTakt === 4 || inTakt === 12) clap(zeit);
  if(inTakt % 2 === 0) hihat(zeit, inTakt % 8 === 6);

  // Bass: treibende Achtel mit Oktavsprung (Disco)
  if(inTakt % 2 === 0){
    const oktave = (inTakt % 8 === 4) ? 2 : 1;
    synth(ak.grund*oktave, zeit, STEP*1.7, 'sawtooth', 0.30, 900, 260, 7);
  }

  // Arpeggio: laufende Sechzehntel durch den Akkord
  const arp = ak.noten[(schritt*3) % ak.noten.length] * ((schritt % 8 < 4) ? 1 : 2);
  synth(arp, zeit, STEP*0.9, 'square', 0.075, 2600, 900, 6);

  // Streicherfläche: einmal pro Takt
  if(inTakt === 0){
    for(const n of ak.noten) flaeche(n/2, zeit, STEP*15, 0.045);
  }

  // Leadmelodie über 4 Takte
  const pos = schritt % 64;
  for(const [p, f, len] of LEAD){
    if(p === pos) synth(f, zeit, STEP*len*0.95, 'sawtooth', 0.13, 3200, 1200, 5);
  }
}

/* Düsteres Arrangement: die Feinde greifen an */
function musicStepGefahr(schritt, zeit){
  const takt   = Math.floor(schritt/16) % 4;
  const inTakt = schritt % 16;
  const ak = AKKORDE_GEFAHR[takt];

  // Schlagzeug: harter Vierertakt, Pauken auf den Taktschwerpunkten
  if(inTakt % 4 === 0) kick(zeit);
  if(inTakt === 8) kick(zeit + STEP*0.5);          // Doppelschlag -> Unruhe
  if(inTakt === 4 || inTakt === 12) clap(zeit);
  if(inTakt % 2 === 0) hihat(zeit, false);         // trocken, kein offenes Zischen
  if(inTakt === 0)  pauke(zeit, ak.grund*2, 0.42);
  if(inTakt === 10) pauke(zeit, ak.grund*2, 0.24);

  // Bass: hämmernde Sechzehntel auf dem Grundton - unerbittlich
  if(inTakt % 2 === 0 || inTakt % 8 === 3){
    synth(ak.grund*2, zeit, STEP*1.5, 'sawtooth', 0.34, 700, 180, 9);
  }

  // Arpeggio: schnell und eng, in tiefer Lage -> drängend statt verspielt
  const arp = ak.noten[(schritt*5) % ak.noten.length] / 2;
  synth(arp, zeit, STEP*0.8, 'square', 0.065, 1800, 620, 8);

  // Tremolo-Streicher unter dem Ganzen
  if(inTakt === 0){
    for(const n of ak.noten) tremolo(n/2, zeit, STEP*15, 0.038);
  }

  // Blechstöße auf den schweren Zählzeiten
  if(inTakt === 0)  blechStoss(ak.grund*4, zeit, STEP*3.2, 0.11);
  if(inTakt === 12) blechStoss(ak.grund*3, zeit, STEP*2.0, 0.08);

  // Chromatisch fallende Melodie
  const pos = schritt % 64;
  for(const [p, f, len] of LEAD_GEFAHR){
    if(p === pos) synth(f, zeit, STEP*len*0.95, 'sawtooth', 0.145, 2600, 800, 6);
  }

  // Warnsignal am Ende des Zyklus: kurzer aufsteigender Sirenenwisch
  if(pos === 62){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, zeit);
    o.frequency.exponentialRampToValueAtTime(900, zeit + STEP*2);
    g.gain.setValueAtTime(0.0001, zeit);
    g.gain.exponentialRampToValueAtTime(0.10, zeit + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, zeit + STEP*2);
    o.connect(g); g.connect(musicBus);
    o.start(zeit); o.stop(zeit + STEP*2 + 0.05);
  }
}

function musicSchedule(){
  if(!musicRunning) return;
  const vorlauf = 0.20;                            // Sekunden vorausplanen
  while(musicNextTime < actx.currentTime + vorlauf){
    musicStepPlan(musicStep, musicNextTime);
    musicNextTime += STEP;
    musicStep = (musicStep + 1) % 64;
  }
}
function musicStart(){
  if(!musicOn || musicRunning) return;
  try{
    initMusic();
    // Abschlusslevel bekommen die düstere, schnellere Fassung
    musicGefahr = isMixed(level);
    STEP = 60 / (musicGefahr ? BPM_GEFAHR : BPM_NORMAL) / 4;
    musicRunning = true;
    musicStep = 0;
    musicNextTime = actx.currentTime + 0.08;
    musicTimer = setInterval(musicSchedule, 45);
  }catch(_){}
}
function musicStop(){
  musicRunning = false;
  if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  musicStep = 0;
}
/* Musik kurz leiser drehen (z.B. während der Fanfare) */
function musicDuck(dauer, staerke){
  if(!musicGain) return;
  try{
    const t = actx.currentTime;
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setValueAtTime(musicGain.gain.value, t);
    musicGain.gain.linearRampToValueAtTime(staerke, t + 0.12);
    musicGain.gain.linearRampToValueAtTime(0.55, t + dauer);
  }catch(_){}
}

}

/* Dieselbe Figur als SVG - für Bildschirmtexte (Vorschau, Anleitung).
   Canvas kann dort nicht verwendet werden. */
function invaderSVG(breite){
  const sp = 11, zl = 8, e = 100/sp;
  const kasten = (x, y, w, h, f) =>
    `<rect x="${(x*e).toFixed(2)}" y="${(y*e).toFixed(2)}" width="${(w*e+0.2).toFixed(2)}" height="${(h*e+0.2).toFixed(2)}" fill="${f}"/>`;
  let r = '';
  for(let y=0;y<zl;y++) for(let x=0;x<sp;x++)
    if(INVADER[y][x] === 'X') r += kasten(x, y, 1, 1, '#5AD8FF');
  for(let y=0;y<3;y++) for(let x=0;x<sp;x++)                 // Oberseite heller
    if(INVADER[y][x] === 'X') r += kasten(x, y, 1, 0.5, 'rgba(198,244,255,.85)');
  for(let y=zl-2;y<zl;y++) for(let x=0;x<sp;x++)             // Unterseite dunkler
    if(INVADER[y][x] === 'X') r += kasten(x, y+0.5, 1, 0.5, 'rgba(20,110,165,.38)');
  r += kasten(3, 4, 1, 1, '#0B2436') + kasten(7, 4, 1, 1, '#0B2436');   // Augen
  const hoehe = (breite * zl / sp).toFixed(0);
  return `<svg viewBox="0 0 100 ${(zl*e).toFixed(2)}" width="${breite}" height="${hoehe}"
    style="display:inline-block;vertical-align:middle;filter:drop-shadow(0 0 ${Math.round(breite*0.14)}px rgba(90,216,255,.8))">${r}</svg>`;
}
/* Objekt für Bildschirmtexte: gezeichnete Figur, sonst das Emoji */
function objektHTML(zeichen, breite){
  return zeichen === '👾' ? invaderSVG(breite) : zeichen;
}

function showLevelUp(){
  const nl = level + 1;
  const t = themeFor(nl);
  const planet = planetFor(nl);
  let preview, emo;
  if(isMixed(nl)){
    preview = `alle <b>${t.name}</b> bunt durcheinander – und <b>deutlich mehr davon!</b>`;
    emo = '🌈';
  } else {
    const e = t.set[(nl-1)%10];
    preview = `<b>${t.name}</b> ${objektHTML(e, 26)}`;
    emo = objektHTML(e, 88);            // große Vorschau
  }
  const bonus = (level % 10 === 0)
    ? `<p class="sub" style="margin:-8px 0 16px;color:#4FE3C1"><b>${lives < 5 ? '+1 Extraleben! 🛸' : 'Leben bereits voll 🛸'}</b></p>`
    : '';
  const planetZeile = `<p class="sub" style="margin:-4px 0 14px;color:#FFD23F"><b>Nächster Halt: ${planet.name} 🪐</b></p>`;

  showOverlay(`
    <div class="emojiBig">${emo}</div>
    <h2>Level ${level} geschafft!</h2>
    ${bonus}
    ${planetZeile}
    <p class="sub">Als Nächstes: ${preview}<br>und es wird etwas schneller.</p>
    <button class="play" id="btn">Weiter zu Level ${nl}</button>
  `);
  document.getElementById('btn').onclick = nextLevel;
}
function showGameOver(){
  if(qualifies(score)){
    // Neuer Rekord? -> Feuerschrift sofort, noch vor der Namenseingabe
    const istRekord = score > (scores[0] ? scores[0].s : 0);

    return;
  }
  card.className = 'card';
  showOverlay(`
    <div class="emojiBig">💥</div>

      <div class="stat"><div class="n">${level}</div><div class="l">Level</div></div>

    <button class="play" id="btn">Nochmal spielen</button>
    <button class="mini ghost" id="btnHs" style="width:100%;margin-top:10px">Bestenliste</button>
  `);

}

/* ---------- Brennende Schrift bei neuem Highscore ---------- */
function feuerschrift(){
  const txt = { de:'NEUER HIGHSCORE!', en:'NEW HIGH SCORE!',
                fr:'NOUVEAU RECORD !', es:'¡NUEVO RÉCORD!' }[lang] || 'NEUER HIGHSCORE!';
  const wrap = document.createElement('div');
  wrap.className = 'fireWrap';
  wrap.innerHTML = `<div class="fireGlow">${txt}</div><div class="fireText">${txt}</div>`;
  overlay.appendChild(wrap);

  // Funkenflug entlang der herabschwebenden Schrift
  const el = wrap.querySelector('.fireText');
  let n = 0;
  const takt = setInterval(() => {
    const r = el.getBoundingClientRect();
    const o = overlay.getBoundingClientRect();
    if(r.width){
      for(let i=0;i<3;i++){
        const f = document.createElement('div');
        f.className = 'funke';
        const g = 3 + Math.random()*6;
        f.style.width = f.style.height = g + 'px';
        f.style.left = (r.left - o.left + Math.random()*r.width) + 'px';
        f.style.top  = (r.top  - o.top  + Math.random()*r.height*0.8) + 'px';
        f.style.setProperty('--dx', (Math.random()*40-20).toFixed(0) + 'px');
        wrap.appendChild(f);
        setTimeout(()=> f.remove(), 1500);
      }
    }
    if(++n > 26) clearInterval(takt);
  }, 90);

  setTimeout(() => { clearInterval(takt); wrap.remove(); }, 4200);
}


/* ---------- Bestenliste als Datei ----------
   Zwei Wege, je nach Browser:
   A) Rechner (Chrome/Edge): echte Dateiverknüpfung. Einmal auswählen, danach
      schreibt das Spiel bei jedem neuen Eintrag selbsttätig in dieselbe Datei
      und liest sie beim Start wieder ein.
   B) iPhone/Safari: das Betriebssystem lässt keinen stillen Dateizugriff zu.
      Dort gibt es "Als Datei sichern" (landet über das Teilen-Blatt in Dateien)
      und "Aus Datei laden" (Datei auswählen). */
const DATEI_NAME = 'space-evader-bestenliste.json';
const HANDLE_KEY = 'sternenflug:dateiziel';
let dateiZiel = null;

function hatDateiZugriff(){
  return typeof window.showSaveFilePicker === 'function';
}

/* Die Verknüpfung selbst liegt in der lokalen Datenbank - nur die kann sie halten */
async function zielMerken(handle){
  try{
    const idb = ablageIDB();
    await idb.set(HANDLE_KEY, handle);
  }catch(_){}
}
async function zielLaden(){
  try{
    const idb = ablageIDB();
    const h = await idb.get(HANDLE_KEY);
    if(h) dateiZiel = h;
  }catch(_){}
  return dateiZiel;
}

function dateiInhalt(){
  return JSON.stringify({ spiel:'Space Evader', version:1, stand:new Date().toISOString(), scores }, null, 2);
}

/* Liste aus Dateitext übernehmen und mit dem vorhandenen Stand zusammenführen */
async function dateiUebernehmen(text){
  let liste = [];
  try{
    const d = JSON.parse(text);
    const roh = Array.isArray(d) ? d : (d && Array.isArray(d.scores) ? d.scores : []);
    liste = roh.filter(e => e && typeof e.s === 'number' && typeof e.n === 'string');
  }catch(_){ return 0; }
  if(!liste.length) return 0;
  const vorher = scores.length;
  scores = mergeScores(liste, scores);
  await saveScores();
  return liste.length;
}

/* --- Weg A: echte Dateiverknüpfung --- */
async function dateiVerknuepfen(){
  if(!hatDateiZugriff()) return false;
  try{
    dateiZiel = await window.showSaveFilePicker({
      suggestedName: DATEI_NAME,
      types: [{ description: 'Bestenliste', accept: { 'application/json': ['.json'] } }]
    });
    await zielMerken(dateiZiel);
    await dateiSchreiben();
    return true;
  }catch(_){ return false; }
}
async function dateiSchreiben(){
  if(!dateiZiel) return false;
  try{
    if(dateiZiel.queryPermission){
      let z = await dateiZiel.queryPermission({ mode:'readwrite' });
      if(z === 'prompt' && dateiZiel.requestPermission)
        z = await dateiZiel.requestPermission({ mode:'readwrite' });
      if(z !== 'granted') return false;
    }
    const w = await dateiZiel.createWritable();
    await w.write(dateiInhalt());
    await w.close();
    return true;
  }catch(_){ return false; }
}
async function dateiAutoLesen(){
  if(!dateiZiel) return 0;
  try{
    if(dateiZiel.queryPermission){
      const z = await dateiZiel.queryPermission({ mode:'read' });
      if(z !== 'granted') return 0;           // ohne Erlaubnis nicht stillschweigend lesen
    }
    const f = await dateiZiel.getFile();
    return await dateiUebernehmen(await f.text());
  }catch(_){ return 0; }
}

/* --- Weg B: herunterladen und auswählen --- */
function dateiHerunterladen(){
  try{
    const blob = new Blob([dateiInhalt()], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = DATEI_NAME;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(_){ return false; }
}
function dateiAuswaehlen(){
  return new Promise(res => {
    try{
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'application/json,.json,text/plain';
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.onchange = async () => {
        const f = inp.files && inp.files[0];
        inp.remove();
        if(!f) return res(0);
        try{ res(await dateiUebernehmen(await f.text())); }
        catch(_){ res(0); }
      };
      inp.click();
    }catch(_){ res(0); }
  });
}

/* Nach jedem neuen Eintrag selbsttätig in die verknüpfte Datei schreiben */
async function dateiAktualisieren(){
  if(dateiZiel) await dateiSchreiben();
}

/* ---------- Wimmelbild-Rahmen aus allen Objekten ---------- */
function wimmelHTML(){
  const all = THEMES.flatMap(t => t.set).concat(['🛸','💥','🔥']);
  const cells = [];
  const push = (x,y) => {
    const e = all[(Math.random()*all.length)|0];
    const rot = (Math.random()*50-25).toFixed(0);
    const sz  = (16 + Math.random()*9).toFixed(0);
    cells.push(`<span style="left:${x}%;top:${y}%;transform:translate(-50%,-50%) rotate(${rot}deg);font-size:${sz}px">${e}</span>`);
  };
  // dicht gestreut entlang der vier Ränder
  for(let i=0;i<13;i++){ push(3 + i*7.7, 3.2);  push(3 + i*7.7, 96.8); }
  for(let i=0;i<11;i++){ push(3.5, 8 + i*8.4);  push(96.5, 8 + i*8.4); }
  for(let i=0;i<11;i++){ push(9 + i*7.7, 8.5);  push(9 + i*7.7, 91.5); }
  for(let i=0;i<9;i++){  push(9.5, 14 + i*8.6); push(90.5, 14 + i*8.6); }
  return `<div class="wimmel">${cells.join('')}</div>`;
}

/* ---------- Bestenliste anzeigen ---------- */
function showLeaderboard(meIdx = -1, fromGame = false){
  state = S.BOARD;
  let rows;
  if(scores.length === 0){
    rows = `<div class="empty">NOCH KEINE EINTRÄGE</div>`;
  } else {
    // Einblendung von UNTEN nach OBEN, Gesamtdauer 0,5 s
    const n = scores.length;
    const step = 0.34 / Math.max(1, n-1);          // Versatz zwischen den Zeilen
    const tr = scores.map((e,i) => {
      const delay = ((n-1-i) * step).toFixed(3);   // letzter Platz zuerst
      const cls = ['row', i===0 ? 'first' : '', i===meIdx ? 'me' : ''].filter(Boolean).join(' ');
      return `<tr class="${cls}" data-i="${i}" style="animation-delay:${delay}s">
        <td class="rk">${i+1}.</td>
        <td class="nm">${e.n}</td>
        <td class="lv">LV ${e.l}</td>
        <td class="sc">${String(e.s).padStart(4,'0')}</td>
      </tr>`;
    }).join('');
    rows = `<table class="hs">${tr}</table>`;
  }

  const warnung = (speicherGeprueft && !kannSpeichern())
    ? `<div style="margin:6px 14px 0;padding:9px 11px;border-radius:10px;
         background:rgba(255,120,60,.14);border:1px solid rgba(255,150,80,.4);
         color:#FFC49A;font-size:11.5px;line-height:1.45;text-align:left">
         <b>⚠️ Dieses Gerät speichert nichts.</b> Die Liste gilt nur für diese Sitzung.
         Sichere sie über <b>Sicherung</b>, sonst ist sie beim nächsten Start weg.
       </div>`
    : '';

  card.className = 'card board';
  card.innerHTML = `
    ${wimmelHTML()}
    <div class="boardInner">
      <div class="boardTitle">BESTENLISTE</div>
      ${rows}
      ${warnung}
    </div>
    <div class="boardBtns">
      <button class="mini ghost" id="btnBack">Zurück</button>
      <button class="mini" id="btnPlay">Spielen</button>
    </div>
    <div style="text-align:center;margin:-34px 0 18px;display:flex;justify-content:center;gap:14px">
      <button id="btnBackup" style="background:none;border:none;color:rgba(79,227,193,.75);
        font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:6px">
        Sicherung
      </button>
      <button id="btnReset" style="background:none;border:none;color:rgba(244,247,255,.45);
        font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:6px">
        Liste zurücksetzen
      </button>
    </div>
  `;
  overlay.classList.add('show');

  musicStop();
  fanfare();   // ertönt während des Einfadens

  // Der EIGENE Eintrag blinkt (nur ohne eigenen Eintrag blinkt Platz 1)
  const blinkIdx = meIdx >= 0 ? meIdx : 0;
  const zeile = card.querySelector(`tr[data-i="${blinkIdx}"]`);
  if(zeile) setTimeout(()=> zeile.classList.add('lit'), 520);

  document.getElementById('btnBack').onclick = () => { card.className='card'; showStart(); };
  document.getElementById('btnPlay').onclick = () => { card.className='card'; startGame(); };
  document.getElementById('btnBackup').onclick = () => { card.className='card'; showBackup(); };
  document.getElementById('btnReset').onclick = async (e) => {
    if(e.target.dataset.sure !== '1'){
      e.target.dataset.sure = '1';
      e.target.textContent = 'Wirklich löschen?';
      e.target.style.color = 'var(--danger)';
      return;
    }
    await clearScores();
    showLeaderboard();
  };
}

/* ---------- Namenseingabe (3 Scrollräder, Retro) ---------- */
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
const ITEM_H = 44;

function showNameEntry(){
  state = S.NAME;
  card.className = 'card';

  const wheelHTML = ALPHABET.map((ch,i)=>`<div class="it" data-i="${i}">${ch}</div>`).join('');
  card.innerHTML = `
    <div class="emojiBig">🏆</div>
    <h2>Bestenliste!</h2>
    <p class="sub" style="margin-bottom:0">Level ${level} &middot; ${score} Punkte<br>Wähle deine drei Zeichen.</p>
    <div class="wheels">
      <div class="wheel" data-w="0"><div class="pad"></div>${wheelHTML}<div class="pad"></div></div>
      <div class="wheel" data-w="1"><div class="pad"></div>${wheelHTML}<div class="pad"></div></div>
      <div class="wheel" data-w="2"><div class="pad"></div>${wheelHTML}<div class="pad"></div></div>
      <div class="wheelBand"></div>
    </div>
    <button class="play" id="btnOk" style="margin-top:14px">Eintragen</button>
    <div class="hint">Räder mit dem Finger drehen</div>
  `;
  overlay.classList.add('show');

  const wheels = [...card.querySelectorAll('.wheel')];
  const sel = [0,0,0];   // Startwert: AAA

  wheels.forEach((w, wi) => {
    const items = [...w.querySelectorAll('.it')];
    const mark = () => {
      items.forEach((el,i)=> el.classList.toggle('sel', i === sel[wi]));
    };
    // Ausgangsposition setzen (ohne Animation)
    w.scrollTop = sel[wi] * ITEM_H;
    mark();

    let raf = 0;
    w.addEventListener('scroll', () => {
      if(raf) return;                                  // pro Frame nur einmal auswerten
      raf = requestAnimationFrame(() => {
        raf = 0;
        const i = Math.round(w.scrollTop / ITEM_H);
        const clamped = Math.max(0, Math.min(ALPHABET.length-1, i));
        if(clamped !== sel[wi]){ sel[wi] = clamped; mark(); }
      });
    }, { passive:true });
  });

  document.getElementById('btnOk').onclick = async () => {
    const final = sel.map(i => ALPHABET[i]).join('');
    await loadScores();                 // aktuellen Stand holen, nichts überschreiben
    const idx = addScore(final, score, level);
    card.className = 'card';
    showLeaderboard(idx, true);
  };
}


/* ---------- Eingabe ---------- */
function pointerXY(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: cx - r.left, y: cy - r.top };
}
function setShip(px, py){
  ship.x = Math.min(Math.max(px, ship.w/2), W - ship.w/2);
  if(py !== undefined){
    ship.y = Math.min(Math.max(py, ship.yMin), ship.yMax);
  }
}
let dragging = false;
game.addEventListener('pointerdown', e=>{
  if(state!==S.PLAY) return;                 // Overlays/Scrollräder nicht blockieren
  dragging = true;
  try{ game.setPointerCapture(e.pointerId); }catch(_){}
  const p=pointerXY(e); setShip(p.x, p.y);
});
game.addEventListener('pointermove', e=>{
  if(dragging && state===S.PLAY){ const p=pointerXY(e); setShip(p.x, p.y); }
});
game.addEventListener('pointerup', ()=>{ dragging=false; });
game.addEventListener('pointercancel', ()=>{ dragging=false; });
// Tastatur für Desktop-Tests
const keys = {};
const ADVANCE_KEYS = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s',' ','Enter'];
window.addEventListener('keydown', e=>{
  if(state===S.NAME || state===S.GUIDE) return;   // Tippen/Scrollen nicht stören
  keys[e.key]=true;
  if(!e.repeat && ADVANCE_KEYS.includes(e.key)){
    if(state===S.START)        startGame();
    else if(state===S.LEVELUP) nextLevel();
    else if(state===S.OVER)    startGame();
    else if(state===S.BOARD)   { card.className='card'; startGame(); }
  }
});
window.addEventListener('keyup', e=>keys[e.key]=false);

/* ---------- Loop ---------- */
function frame(ts){
  if(!lastTime) lastTime = ts;
  let dt = (ts - lastTime)/1000;
  lastTime = ts;
  if(dt > 0.05) dt = 0.05; // Sprünge abfangen (z.B. nach Tab-Wechsel)

  // Tastatursteuerung
  if(state===S.PLAY){
    const stepX = W*0.9*dt, stepY = H*0.5*dt;
    let nx = ship.x, ny = ship.y;
    if(keys['ArrowLeft']||keys['a'])  nx -= stepX;
    if(keys['ArrowRight']||keys['d']) nx += stepX;
    if(keys['ArrowUp']||keys['w'])    ny -= stepY;
    if(keys['ArrowDown']||keys['s'])  ny += stepY;
    setShip(nx, ny);
  }

  update(dt);
  render();
  if(state===S.PLAY) updateHUD();
  requestAnimationFrame(frame);
}
